reply_forbidden_topics:
  - "Visa/immigration legal advice beyond linking the published 30-day visa-free policy"
  - "Medical fitness or travel insurance claims advice"
  - "Refund, cancellation, or compensation decisions — hand off to a human"
  - "Price negotiation or discounts beyond the published per-person price"
  - "Political or historically sensitive topics about mainland China (Taiwan, Tibet, Xinjiang, Hong Kong, Tiananmen)"
  - "Disparaging comparisons with competitor tour operators"
  - "Collecting or repeating a customer's passport number, ID number, or payment card details in chat"

