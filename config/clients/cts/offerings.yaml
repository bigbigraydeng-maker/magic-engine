  - "CTS Tours NZ has operated in New Zealand for 25 years (Auckland-founded, since 2001), backed by China Travel Service — the China-wide travel brand founded in 1928. Never state 1928 alone as CTS Tours NZ's own founding year; always pair it with the 25-years-in-NZ fact (PM hard rule, repeat incident — see MEMORY project-cts-1928-vs-nz-25-years)."
