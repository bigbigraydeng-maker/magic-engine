# CTS Tours NZ — offerings fact layer (Issue #1577)
#
# This file is the SINGLE SOURCE OF TRUTH for which China tours CTS Tours NZ is
# currently selling. It exists to stop the exact incident that started this
# project: Meta's official AI reading a still-live website page and telling a
# customer a retired tour is bookable.
#
# Owner: PM / FDE (manual edits only — no code should write to this file).
# Consumers: Agent reasoning layer (Issue F) + Verifier governance layer
# (Issue D), both loaded through src/lib/messenger-agent/offerings-loader.ts
# (Zod-validated, 5-minute in-memory cache).
#
# Maintenance rule: edit this file first, then the change is live for the
# reply agent within 5 minutes (see offerings-loader.ts cache TTL). Always
# bump last_verified_at when you touch active_tours / retired_tours.
#
# `retired_tours[].still_visible_on_website: true` means the marketing page
# is still live even though the tour is not for sale — that gap is exactly
# what this file exists to close.
#
# ── 2026-09-13 first draft — READ BEFORE TRUSTING THIS FILE ────────────────
# This draft was assembled by a Claude Code agent via WebFetch against the
# live ctstours.co.nz site, per Issue #1577. It has NOT been reviewed by PM
# or FDE yet. See the PR description for the full list of fields that are
# agent-generated guesses or unresolved conflicts, in particular:
#   - All `aliases` are agent-guessed customer phrasing, not sourced from the
#     website or from PM/FDE. The issue recommended generating aliases with
#     two independent agents and merging by hand; this draft only used one.
#   - `reply_forbidden_topics` is an agent-drafted default list based on
#     general travel-agency good practice, not something CTS or PM supplied.
#     It needs PM/FDE sign-off before the Verifier layer enforces it.
#
# ── 2026-09-13 PM resolution on the 3 "known retired" tours ────────────────
# Issue #1577 named Silk Road Discovery / A Tale of Two Cities / Shanghai &
# Surroundings as the tours Meta's AI had wrongly reported as bookable. Live
# WebFetch found all three still bookable with real 2027 pricing/dates. PM
# confirmed (2026-09-13): these are genuine current tours — only their 2026
# departure had sold out, not the tour itself. Moved to `active_tours` below
# with real 2027 data (nights/highlights independently re-fetched from each
# live page, not carried over from guesses). `retired_tours` is intentionally
# empty for now — CTS has no currently-known discontinued tour on file. The
# underlying incident (Meta's AI trusting stale/cached site info instead of
# real-time inventory) is still the reason this whole system exists; it just
# means the *next* wrongly-reported tour could be any tour, not only these
# three — the Verifier's number/date-claim gates (not just the retired-tour
# gate) are what actually protect against that.

