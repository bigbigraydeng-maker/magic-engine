  # 客户私信 → CRM。PR #652/#653 把接口合进来了,但没有人调用它们,
  # 「客户消息」页会永远是空的 —— 这里补上调用方。
  #
  # 🔴 **写需求卡那一步 2026-09-07 挪走了,别再往这里加第二条 curl。**
  #    原来这里是 `curl 私信同步 && curl 写需求卡`。意图是对的 ——「同步没跑成就别
  #    拿半截数据写卡给销售看」—— 但 `&&` 守的是 curl 的退出码,而退出码回答的是
  #    「网关有没有在超时前把响应给我」,不是「同步有没有跑完」。
  #    同步的服务端耗时 2026-08-17 起从约 25 秒跳到约 140 秒,网关约 125 秒掐断返 524,
  #    curl -f 退出码 22 → && 短路 → **写卡那条从 2026-08-23 起一次都没执行过**,
  #    销售的客户需求卡停更 14 天,而监控上「私信同步每小时正常」。
  #
  #    现在:同步跑到最后一行发一张 `me/messenger.sync.completed` 条子,
  #    Inngest 上的 `cloud-messenger-brief-after-sync` 收到就写卡(还分段跑,每段约 40 秒,
  #    不再踩网关那条线)。判据从「curl 的退出码」换成「服务端自己的回执」。
  #    整段来龙去脉见 src/lib/messenger/sync-completed-event.ts。
  #
  #    ⚠️ Render 不是 Vercel,Inngest 没有自动同步:改了那个函数之后必须重新 Sync 一次
  #       `curl -sS -X PUT https://app.magicengine.com.au/api/inngest`(返 modified:true 才算数),
  #       否则它**安静地不跑**。这条链路已登记进 CRON_REGISTRY,真没跑起来健康检查会喊。
  #
  #    `/api/cron/messenger-brief-hourly` 路由保留,用于单独手动补触发。
  #
  # 只同步 clients.facebook_page_id 有值的客户(设置页里选主页才会有值),
  # 所以新增客户不需要动这里。
  # max-time 跟接口的 maxDuration 对齐(600s)再留一点余量。
  #
  # ⏸️ **降频到每 2 小时的改动已从本 PR 抽出，暂不落地**（issue #1581，H14 原计划）：
  #    方案是"`/api/webhooks/meta/messenger` 上线后，实时收信改由那条 webhook 负责，
  #    这条任务降级成兜底"，但截至提交这版代码，Meta 生产企业验证仍未通过
  #    （issue #1299 仍是 OPEN），webhook 订阅还打不开。这条 cron 现在仍是**唯一在收
  #    真实消息的路径**——这时候降频 = 私信进系统的延迟从 ≤1h 变成 ≤2h，是纯粹的倒退，
  #    没有任何东西在补它腾出来的窗口。CTS/NAL 广告私信留资流程正在依赖这条延迟
  #    （2026-09-13 CTS 广告顾问窗口反馈）。**保持每小时不变，等 #1299 关闭、webhook
  #    真正收到生产流量、并用真实数据验证过之后，再单独一个 PR 改这条 schedule。**
  #    `src/lib/messenger/sync.ts` 的 `storeConversation` 防覆写改动（"只在本轮数据比
  #    已存的新时才覆盖 participant_name/last_message_at/last_message_from"）不受这条
  #    影响，正常保留——那是数据正确性修复，跟频率无关，任何频率下都成立。
  #
  # ⚠️ 这条 curl **本来就会超时**(网关约 125 秒掐断返 524,而接口跑约 140 秒),
  #    Render 的运行日志里会看到 `curl: (22) ... error: 524` / `Exited with status 22`。
  #    服务端每一轮都跑完了 —— 判据看 cron_run_logs 里 messenger-sync-hourly 那一行,
  #    不看这条 curl 的退出码。别再往这个退出码上挂任何下游步骤。
  - type: cron
    name: messenger-hourly
    env: node
    schedule: "10 * * * *"
    buildCommand: ""
    startCommand: |
      curl -fsS --max-time 620 -H "Authorization: Bearer $CRON_SECRET" \
        https://app.magicengine.com.au/api/cron/messenger-sync-hourly
    envVars:
      - key: CRON_SECRET
        sync: false

