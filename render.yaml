services:
  - type: web
    name: magic-engine
    env: node
    plan: standard
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      # ── Voice Agent (docs/voice-agent/) ──
      - key: OPENAI_PROJECT_ID
        sync: false
      - key: OPENAI_WEBHOOK_SECRET
        sync: false
      - key: OPENAI_REALTIME_MODEL
        value: gpt-realtime-2.1-mini
      - key: OPENAI_SUMMARY_MODEL
        value: gpt-4o-mini
      - key: OPENAI_KB_MODEL
        value: gpt-4o-mini
      - key: INTERNAL_WORKER_TOKEN
        sync: false
      - key: REALTIME_WORKER_URL
        sync: false           # private URL of the voice-realtime-worker service
      - key: VOICE_STORE
        value: supabase
      - key: OUTBOUND_CALLING_ENABLED
        value: "false"        # sandbox only until real-call go-live (板桥 硬闸 #3)
      - key: VOICE_TEST_NUMBERS
        sync: false
      - key: VOICE_DEFAULT_AGENT_ID
        sync: false           # single-number fallback when the DID isn't preserved
      - key: DEFAULT_COUNTRY
        value: NZ
      - key: DEFAULT_TIMEZONE
        value: Pacific/Auckland
      - key: ANTHROPIC_API_KEY
        sync: false
      # ⚠️ 代码读的是 ATLAS_CLOUD_API_KEY（src/lib/visual/{atlas,seedance,wavespeed}.ts）。
      # ATLAS_API_KEY 是历史遗留名字，代码里没有任何地方读它 —— 只填它 = 图片/视频生成挂掉。
      # 两个都先留着，等确认 Render 面板现状后再删旧名。见 docs/PITFALLS.md A1。
      - key: ATLAS_CLOUD_API_KEY
        sync: false
      - key: ATLAS_API_KEY          # 待清理（无代码读取）
        sync: false
      - key: HEYGEN_API_KEY
        sync: false
      - key: HEYGEN_DEFAULT_AVATAR_ID
        sync: false
      - key: HEYGEN_DEFAULT_VOICE_ID
        sync: false
      - key: SEMRUSH_API_KEY
        sync: false
      - key: SEMRUSH_DB
        value: au
      - key: DATAFORSEO_LOGIN
        sync: false
      - key: DATAFORSEO_PASSWORD
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: PUBLER_API_KEY
        sync: false
      - key: PUBLER_WORKSPACE_ID
        sync: false
      - key: PERPLEXITY_API_KEY
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        value: https://app.magicengine.com.au
      - key: APP_URL
        value: https://app.magicengine.com.au
      - key: OPENAI_BASE_URL
        value: https://gateway.ai.cloudflare.com/v1/bbd84393da8e5707ba617749dc17117c/magic-engine/openai
      - key: ANTHROPIC_BASE_URL
        value: https://gateway.ai.cloudflare.com/v1/bbd84393da8e5707ba617749dc17117c/magic-engine/anthropic
      - key: YOUTUBE_API_KEY
        sync: false
      - key: CLOUDFLARE_MGMT_TOKEN
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: CLIENT_VIEWERS
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RENDER_EXTERNAL_URL
        fromService:
          type: web
          name: magic-engine
          property: host

  # NOTE: Voice Agent realtime link runs IN-PROCESS inside the web service (MVP mode) —
  # the webhook opens the OpenAI realtime WebSocket directly, so NO separate worker
  # service is needed. To scale it out later, deploy scripts/voice/realtime-worker.ts as
  # a Render private service and set REALTIME_WORKER_URL on the web service to its
  # internal URL (see docs/voice-agent/RUNBOOK.md).

  # Vision Asset Intelligence analyzer — every 10 minutes (降频于 2026-07-21, commit b9f8189)
  # Picks up pending client_assets, runs GPT-4o-mini Vision, writes scores.
  # Reference: docs/history/CHANGELOG.md (P21.B.3)
  # healthchecks.io: vision-analyzer (1b1cd19b-583a-41ac-baaa-c9415241d5e8)
  - type: cron
    name: vision-analyzer
    env: node
    schedule: "*/10 * * * *"
    buildCommand: ""
    startCommand: |
      curl -fsS --max-time 120 -X POST -H "Authorization: Bearer $CRON_SECRET" \
        https://app.magicengine.com.au/api/cron/vision-analyzer \
        && curl -fsS "https://hc-ping.com/1b1cd19b-583a-41ac-baaa-c9415241d5e8"
    envVars:
      - key: CRON_SECRET
        sync: false

  # Poll visual generation jobs every 2 minutes
  # healthchecks.io: poll-visual-jobs (0dd2b641-499f-4f2f-8b73-73085050a5f0)
  - type: cron
    name: poll-visual-jobs
    env: node
    schedule: "*/10 * * * *"
    buildCommand: ""
    startCommand: |
      curl -fsS --max-time 60 -H "Authorization: Bearer $CRON_SECRET" \
        https://app.magicengine.com.au/api/cron/poll-visual-jobs \
        && curl -fsS "https://hc-ping.com/0dd2b641-499f-4f2f-8b73-73085050a5f0"
    envVars:
      - key: CRON_SECRET
        sync: false

  # Site Audit job maintenance (cleanup, watchdog, recovery)
  # Runs daily at 2 AM UTC (~2 PM NZST)
  # Functionality:
  #   - Cleanup: Delete jobs completed > 30 days ago
  #   - Watchdog: Detect and log failed jobs (status='failed' with error_message)
  #   - Recovery: Resume pending jobs stuck > 1 hour
  # Reference: ROADMAP.md P8.0.5.6
  # healthchecks.io: site-audit-cron (8451084d-23c0-44b0-af00-8e29ff80fcdc)
  - type: cron
    name: site-audit-cron
    env: node
    schedule: "0 2 * * *"
    buildCommand: ""
    startCommand: |
      curl -fsS --max-time 120 -X POST -H "x-cron-secret: $CRON_SECRET" \
        https://app.magicengine.com.au/api/cron/site-audit-jobs \
        && curl -fsS "https://hc-ping.com/8451084d-23c0-44b0-af00-8e29ff80fcdc"
    envVars:
      - key: CRON_SECRET
        sync: false

  # Flywheel attribution job — every 6 hours
  # Computes baseline/after/verdict for every flywheel_action with an expected_metric.
  # Reference: ROADMAP.md P12.A.9
  # healthchecks.io: attribution-cron (87926446-35cf-4e5b-a868-bb784c27ee5f)
  - type: cron
    name: attribution-cron
    env: node
    schedule: "0 */6 * * *"
    buildCommand: ""
    startCommand: |
      curl -fsS --max-time 300 -X POST -H "Authorization: Bearer $CRON_SECRET" \
        https://app.magicengine.com.au/api/cron/attribution \
        && curl -fsS "https://hc-ping.com/87926446-35cf-4e5b-a868-bb784c27ee5f"
    envVars:
      - key: CRON_SECRET
        sync: false

  # Zhangqian discovery sweeper — every 5 minutes
  # Marks stuck pending/running discovery jobs (>10 min) as failed.
  # The status route's stale check is reactive (UI-poll driven), so jobs
  # whose UI was closed mid-run would otherwise sit running forever.
  # healthchecks.io: zhangqian-sweeper (071910fe-b9b7-435d-8b72-f141818eb03d)
  - type: cron
    name: zhangqian-sweeper
    env: node
    schedule: "*/15 * * * *"
    buildCommand: ""
    startCommand: |
      curl -fsS --max-time 60 -H "Authorization: Bearer $CRON_SECRET" \
        https://app.magicengine.com.au/api/cron/zhangqian-sweeper \
        && curl -fsS "https://hc-ping.com/071910fe-b9b7-435d-8b72-f141818eb03d"
    envVars:
      - key: CRON_SECRET
        sync: false

  # Prospecting auto-sweep — every 10 minutes (Phase 35)
  # Advances the outbound conveyor one bounded step per fire:
  #   audit -> analyze -> draft -> discover next industry x NZ-city seed.
  # No-ops unless PROSPECTING_SWEEP_ENABLED=true (ships dark; PM turns spend on).
  # Sending stays human — drafts land in the review queue only.
  - type: cron
    name: prospecting-sweep
    env: node
    schedule: "*/30 * * * *"
    buildCommand: ""
    startCommand: |
      curl -fsS --max-time 300 -H "Authorization: Bearer $CRON_SECRET" \
        https://app.magicengine.com.au/api/cron/prospecting-sweep
    envVars:
      - key: CRON_SECRET
        sync: false

  # Job-signal discovery — weekly (Mon 02:00 UTC ≈ Mon 2pm/3pm NZST).
  # Harvests NZ marketing-role postings (Seek), resolves each hiring company via
  # Places, inserts new ones as discovered(job_board). The prospecting-sweep then
  # audits/analyses/drafts them. No-ops unless JOB_SIGNAL_INGEST_ENABLED=true on
  # the web service (ships dark; PM turns it on). Sending stays human downstream.
  - type: cron
    name: job-boards-weekly
    env: node
    schedule: "0 2 * * 1"
    buildCommand: ""
    startCommand: |
      curl -fsS --max-time 300 -H "Authorization: Bearer $CRON_SECRET" \
        https://app.magicengine.com.au/api/cron/job-boards-weekly
    envVars:
      - key: CRON_SECRET
        sync: false

  # Blog generation sweeper — every 5 minutes
  # Marks blog_posts stuck at status='generating' (>10 min) as failed.
  # Background generation in /api/clients/[id]/blog is fire-and-forget;
  # if Render restarts mid-run, rows would otherwise sit generating forever.
  # Reference: ROADMAP.md P14.C.1
  # healthchecks.io: blog-stuck-generating-sweeper (180d3e65-1910-4f8d-a778-409571d5fb46)
  - type: cron
    name: blog-stuck-generating-sweeper
    env: node
    schedule: "*/15 * * * *"
    buildCommand: ""
    startCommand: |
      curl -fsS --max-time 60 -H "Authorization: Bearer $CRON_SECRET" \
        https://app.magicengine.com.au/api/cron/blog-stuck-generating \
        && curl -fsS "https://hc-ping.com/180d3e65-1910-4f8d-a778-409571d5fb46"
    envVars:
      - key: CRON_SECRET
        sync: false

  # Weekly AI Visibility Tracker — every Monday at 1am UTC (~1pm NZST)
  # Processes all clients with enabled queries; writes runs + weekly snapshot.
  # --max-time 30: route returns 202 immediately (fire-and-forget), so 30s is
  # plenty. Avoids Cloudflare 524 timeout that killed previous sync runs.
  # Reference: ROADMAP.md P7.4.13
  # healthchecks.io: ai-tracker-weekly (c4f101fe-c2cf-47f9-807f-08ea09d43934)
  - type: cron
    name: ai-tracker-weekly
    env: node
    schedule: "0 1 * * 1"
    buildCommand: ""
    startCommand: |
      curl -fsS --max-time 30 -H "Authorization: Bearer $CRON_SECRET" \
        https://app.magicengine.com.au/api/cron/ai-tracker-weekly \
        && curl -fsS "https://hc-ping.com/c4f101fe-c2cf-47f9-807f-08ea09d43934"
    envVars:
      - key: CRON_SECRET
        sync: false

  # Daily Industry AI Visibility Archive — every day at 2:30am UTC (~2:30pm NZST)
  # Runs all 10+ industry questions × 3 platforms (ChatGPT / Google AI Overview /
  # Google SERP), upserts one snapshot per (question, platform, collected_date).
  # PM decision 2026-06-04: daily (not weekly) — only daily granularity captures
  # brand churn within the week. Cost ~$0.06/day for 10 seed questions.
  # Migration 20260622000003 enabled daily UNIQUE constraint.
  # healthchecks.io: industry-ai-visibility-daily (1400fe83-cc62-4634-9f7e-a2345553beee)
  - type: cron
    name: industry-ai-visibility-daily
    env: node
    schedule: "30 2 * * *"
    buildCommand: ""
    startCommand: |
      curl -fsS --max-time 600 -H "Authorization: Bearer $CRON_SECRET" \
        https://app.magicengine.com.au/api/cron/ai-visibility-weekly \
        && curl -fsS "https://hc-ping.com/1400fe83-cc62-4634-9f7e-a2345553beee"
    envVars:
      - key: CRON_SECRET
        sync: false

  # Phase 31 A2.1-γ — Goal current_value refresh
  # Daily 03:00 UTC (~15:00 NZST), runs AFTER industry-ai-visibility-daily (02:30 UTC)
  # so ai_visibility_score Goals read today's snapshots (not yesterday's).
  # Spec: docs/superpowers/specs/2026-06-04-a21-stepc-design-v3.md (v3.1)
  # healthchecks.io: goal-current-value-refresh (300bb7f9-8a16-4a72-b9eb-a924dc76efa8)
  - type: cron
    name: goal-current-value-refresh
    env: node
    schedule: "0 3 * * *"
    buildCommand: ""
    startCommand: |
      curl -fsS --max-time 300 -H "Authorization: Bearer $CRON_SECRET" \
        https://app.magicengine.com.au/api/cron/goal-current-value-refresh \
        && curl -fsS "https://hc-ping.com/300bb7f9-8a16-4a72-b9eb-a924dc76efa8"
    envVars:
      - key: CRON_SECRET
        sync: false

  # Weekly SEO keyword snapshots — every Monday at 2am UTC (~2pm NZST)
  # Stores DataForSEO ranked keyword rows for SEO Intelligence trends.
  # Reference: ROADMAP.md P12.I.8
  # healthchecks.io: keyword-snapshots-weekly (db156874-3c69-4b5a-b534-a6bbea63a467)
  - type: cron
    name: keyword-snapshots-weekly
    env: node
    schedule: "0 2 * * 1"
    buildCommand: ""
    startCommand: |
      curl -fsS --max-time 900 -H "Authorization: Bearer $CRON_SECRET" \
        https://app.magicengine.com.au/api/cron/keyword-snapshots-weekly \
        && curl -fsS "https://hc-ping.com/db156874-3c69-4b5a-b534-a6bbea63a467"
    envVars:
      - key: CRON_SECRET
        sync: false

  # Weekly reputation snapshots — every Monday at 3:30am UTC (~3:30pm NZST)
  # GBP / Tripadvisor rating + review count + incremental reviews for active
  # clients with reputation identities configured (DataForSEO 计划 阶段 2).
  # ⚠️ 新 cron 上线后必须在 Render 后台 link "me-shared-cron-secret" env group，
  #    否则 CRON_SECRET 为空 → 每周 401 静默失败（daily-cron-digest 事故教训）。
  - type: cron
    name: reputation-snapshots-weekly
    env: node
    schedule: "30 3 * * 1"
    buildCommand: ""
    startCommand: |
      curl -fsS --max-time 900 -H "Authorization: Bearer $CRON_SECRET" \
        https://app.magicengine.com.au/api/cron/reputation-snapshots-weekly
    envVars:
      - key: CRON_SECRET
        sync: false

  # Daily social engagement pullback — every day at 4am UTC
  # Pulls Publer post likes/comments/shares into flywheel_metrics.
  # Reference: ROADMAP.md P12.C.3
  # healthchecks.io: social-engagement-pullback (01c469cc-4e77-4e88-bba4-7f17cbec91bc)
  - type: cron
    name: social-engagement-pullback
    env: node
    schedule: "0 4 * * *"
    buildCommand: ""
    startCommand: |
      curl -fsS --max-time 300 -H "Authorization: Bearer $CRON_SECRET" \
        https://app.magicengine.com.au/api/cron/social-engagement-pullback \
        && curl -fsS "https://hc-ping.com/01c469cc-4e77-4e88-bba4-7f17cbec91bc"
    envVars:
      - key: CRON_SECRET
        sync: false

  # Daily Winner Reel Auto-Sync — every day at 15:00 UTC (= 03:00 NZST, NZST=UTC+12)
  # Phase 34.A: scans a client's FB Page organic Reels, promotes winners into the
  # ThruPlay pool (new Ads default PAUSED, FDE approves). Migrated off GitHub Actions:
  # GHA scheduled workflows are best-effort and the 2026-07-11 15:00 UTC run never fired.
  # Render Cron Scheduler is a dedicated scheduler and fires reliably.
  # Reference: docs/sops/winner-reel-auto-sync.md · PR #542/#545
  # TODO(healthchecks): create a healthchecks.io monitor + append its hc-ping URL as a
  #   dead-man switch (emails if a run is missed). Left off until a UUID is provisioned;
  #   the cts-meta-daily-selfcheck scheduled task already flags a missed run in the interim.
  - type: cron
    name: winner-reel-sync-daily
    env: node
    schedule: "0 15 * * *"
    buildCommand: ""
    startCommand: |
      curl -fsS --max-time 300 -H "Authorization: Bearer $CRON_SECRET" \
        https://app.magicengine.com.au/api/cron/winner-reel-sync-daily
    envVars:
      - key: CRON_SECRET
        sync: false

  # Daily Google data pullback — every day at 3am UTC (~3pm NZST)
  # Syncs GSC + GA4 snapshots for all clients with connected Google connectors.
  # Reference: ROADMAP.md P17.A.4
  # healthchecks.io: google-data-pullback-daily (12f3c5c4-4524-48b8-92c5-72fd2b775d01)
  - type: cron
    name: google-data-pullback-daily
    env: node
    schedule: "0 3 * * *"
    buildCommand: ""
    startCommand: |
      curl -fsS --max-time 900 -H "Authorization: Bearer $CRON_SECRET" \
        https://app.magicengine.com.au/api/cron/google-data-pullback-daily \
        && curl -fsS "https://hc-ping.com/12f3c5c4-4524-48b8-92c5-72fd2b775d01"
    envVars:
      - key: CRON_SECRET
        sync: false

  # Weekly 诸葛亮 recalculation — every Monday at 3am UTC
  # Re-runs priority analysis for all clients with confirmed discovery,
  # writes fresh recommendations to execution_items kanban.
  # Reference: ROADMAP.md P24.B
  # healthchecks.io: zhuge-weekly-recalculate (a2c4d128-e09c-41eb-843e-98c9a0afecba)
  - type: cron
    name: zhuge-weekly-recalculate
    env: node
    schedule: "0 3 * * 1"
    buildCommand: ""
    startCommand: |
      curl -fsS --max-time 900 -H "Authorization: Bearer $CRON_SECRET" \
        https://app.magicengine.com.au/api/cron/zhuge-recalculate \
        && curl -fsS "https://hc-ping.com/a2c4d128-e09c-41eb-843e-98c9a0afecba"
    envVars:
      - key: CRON_SECRET
        sync: false

  # Viral reference analyzer worker — every 2 minutes
  # Throttled queue drainer: picks up to 8 pending videos, runs Gemini analysis
  # sequentially with 5s delay between calls. Without this, viral-discovery would
  # burst 150+ concurrent Gemini calls and hit paid-tier TPM cap (1M tok/min).
  # healthchecks.io: viral-analyzer-worker (55891cbc-cfd5-4c58-b28b-f06206fade5a)
  - type: cron
    name: viral-analyzer-worker
    env: node
    schedule: "*/10 * * * *"
    buildCommand: ""
    startCommand: |
      curl -fsS --max-time 300 -X POST -H "Authorization: Bearer $CRON_SECRET" \
        https://app.magicengine.com.au/api/cron/viral-analyzer-worker \
        && curl -fsS "https://hc-ping.com/55891cbc-cfd5-4c58-b28b-f06206fade5a"
    envVars:
      - key: CRON_SECRET
        sync: false

  # Daily viral YouTube discovery — every day at 0am UTC (~12pm NZST)
  # 8 industries × 6 keyword groups × limit 20 = up to ~960 videos/day.
  # Auto-deduplicates, inserts new rows, kicks off Gemini analysis.
  # Quota cost ~5,760 units/day (free tier = 10,000/day).
  # healthchecks.io: viral-discovery-weekly (e5c6cbe8-e6cc-457f-bb3f-538971dafd46)
  - type: cron
    name: viral-discovery-weekly
    env: node
    schedule: "0 0 * * *"
    buildCommand: ""
    startCommand: |
      curl -fsS --max-time 300 -X POST -H "Authorization: Bearer $CRON_SECRET" \
        https://app.magicengine.com.au/api/cron/viral-discovery-weekly \
        && curl -fsS "https://hc-ping.com/e5c6cbe8-e6cc-457f-bb3f-538971dafd46"
    envVars:
      - key: CRON_SECRET
        sync: false

  # 内容工厂 · 选题进料 — 每天 UTC 22:00 (~10am NZST) 抓爆款+按人设改写成候选。
  # cron 每天打；路由内部按每个客户的 topic_intake.cadence 过滤(daily 每天/weekly 只周一/off 跳)。
  # ⚠️ 部署后需在 Render 手动 link me-shared-cron-secret env group，否则每天静默 401。
  #    建议再配一个 healthchecks.io ping(&& curl hc-ping.com/<uuid>)防"没跑"不报警。
  - type: cron
    name: content-factory-intake
    env: node
    schedule: "0 22 * * *"
    buildCommand: ""
    startCommand: |
      curl -fsS --max-time 300 -X POST -H "Authorization: Bearer $CRON_SECRET" \
        https://app.magicengine.com.au/api/cron/content-factory-intake
    envVars:
      - key: CRON_SECRET
        sync: false

  # Daily anomaly detector — every day at 5am UTC (~5pm NZST / 3pm AEST)
  # Two-step pipeline:
  #   Step 1: AnomalyDetectorJob — scans flywheel_metrics, writes anomaly_signals
  #   Step 2: 诸葛亮 Proactive — reads fresh signals, creates proactive execution tasks
  # Reference: ROADMAP.md § Phase 22.D.3
  # healthchecks.io: anomaly-detector-daily (ff78126a-25e2-4a50-abcb-edbcb1dfaec9)
  - type: cron
    name: anomaly-detector-daily
    env: node
    schedule: "0 5 * * *"
    buildCommand: ""
    startCommand: |
      curl -fsS --max-time 300 -H "Authorization: Bearer $CRON_SECRET" \
        https://app.magicengine.com.au/api/cron/anomaly-detector \
        && curl -fsS "https://hc-ping.com/ff78126a-25e2-4a50-abcb-edbcb1dfaec9"
    envVars:
      - key: CRON_SECRET
        sync: false

  # Daily cron health digest — every day at 6am UTC (~6pm NZST)
  # Queries cron_run_logs for the past 24h; sends Resend email only if failures found.
  # healthchecks.io: daily-cron-digest (10c101e8-05a0-4026-9531-39edddd7c74d)
  - type: cron
    name: daily-cron-digest
    env: node
    schedule: "0 6 * * *"
    buildCommand: ""
    startCommand: |
      curl -fsS --max-time 60 -H "Authorization: Bearer $CRON_SECRET" \
        https://app.magicengine.com.au/api/cron/daily-cron-digest \
        && curl -fsS "https://hc-ping.com/10c101e8-05a0-4026-9531-39edddd7c74d"
    envVars:
      - key: CRON_SECRET
        sync: false

  # Proposal view digest — every day at 19:00 UTC (~07:00 NZST next morning)
  # Rolls up who opened a Magic Engine sales proposal in the past 24h from
  # website_lead_events (source='proposal_tracking'), and emails the read
  # pattern to hello@magicengine.cloud. Sends nothing on a quiet day, so the
  # arrival of the email is itself the signal.
  - type: cron
    name: proposal-view-digest
    env: node
    schedule: "0 19 * * *"
    buildCommand: ""
    startCommand: |
      curl -fsS --max-time 60 -H "Authorization: Bearer $CRON_SECRET" \
        https://app.magicengine.com.au/api/cron/proposal-view-digest
    envVars:
      - key: CRON_SECRET
        sync: false

  # Agent Learning Rollup — DAPE W3 (spec §3.3)
  # Weekly aggregator: takes the previous ISO week (Mon 00:00 UTC → Mon 00:00 UTC)
  # of flywheel_outcomes + zhuge_feedback_events and writes ONE summary
  # preference per active client into client_learned_preferences. Next agent run
  # reads it via loadMemoryForClient so "what worked / what got dismissed last
  # week" is in the prompt without re-deriving from raw outcomes each time.
  # Runs Mon 07:00 UTC (after the Sunday/early Monday data pulls have settled).
  # Reference: docs/superpowers/specs/2026-06-08-me-dape-redefine-v0.2.md §3.3
  - type: cron
    name: agent-learning-rollup
    env: node
    schedule: "0 7 * * 1"
    buildCommand: ""
    startCommand: |
      curl -fsS --max-time 300 -X POST -H "Authorization: Bearer $CRON_SECRET" \
        https://app.magicengine.com.au/api/cron/agent-learning-rollup
    envVars:
      - key: CRON_SECRET
        sync: false

  # SEO Patrol — Phase 22.E.S2b
  #   Daily SEO opportunity engine: reads keyword_snapshots + GSC snapshots,
  #   runs the rule engine, persists fresh findings, and routes the top 3 onto
  #   the SEO kanban column via 诸葛亮's persister (source='zhuge').
  #   Runs after google-data-pullback-daily (3am) so data is fresh.
  # Oztop SEO automation loop — weekly meta optimisation
  # Reads GSC opportunity keywords (pos 4-20) → AI meta → WP PATCH → work log
  # Requires: OZTOP_WP_USERNAME, OZTOP_WP_APP_PASSWORD (set in Render dashboard)
  - type: cron
    name: oztop-seo-optimizer
    env: node
    schedule: "0 5 * * 1"
    buildCommand: ""
    startCommand: |
      curl -fsS --max-time 300 -X POST \
        -H "Authorization: Bearer $CRON_SECRET" \
        "https://app.magicengine.com.au/api/cron/oztop-seo-optimizer?max=8"
    envVars:
      - key: CRON_SECRET
        sync: false

  # Weekly site recrawl — Sunday 01:00 UTC. Refreshes client_site_pages for
  # focus clients (seo_config.weekly_blog=true) so the patrol's link-graph
  # (R2) and blog page-context stay at most a week old.
  # ⚠️ sync:false does NOT auto-fill: after first deploy, link the
  #    me-shared-cron-secret env group to this service in the Render dashboard.
  - type: cron
    name: site-audit-weekly
    env: node
    schedule: "0 1 * * 0"
    buildCommand: ""
    startCommand: |
      curl -fsS --max-time 900 -H "Authorization: Bearer $CRON_SECRET" \
        https://app.magicengine.com.au/api/cron/site-audit-weekly
    envVars:
      - key: CRON_SECRET
        sync: false

  # Weekly watchdog report — 18:30 UTC Sunday = Monday ~06:30 NZST, half an
  # hour before Monday's daily to-do. Per focus client: rankings / auto
  # changes / blog / social / ads, every section freshness-stamped.
  # ⚠️ sync:false does NOT auto-fill: after first deploy, link the
  #    me-shared-cron-secret env group to this service in the Render dashboard.
  - type: cron
    name: weekly-seo-report
    env: node
    schedule: "30 18 * * 0"
    buildCommand: ""
    startCommand: |
      curl -fsS --max-time 300 -H "Authorization: Bearer $CRON_SECRET" \
        https://app.magicengine.com.au/api/cron/weekly-seo-report
    envVars:
      - key: CRON_SECRET
        sync: false

  # PM daily to-do — 19:00 UTC Sun-Thu = NZ weekday mornings (07:00 NZST /
  # 08:00 NZDT). Rolling pillar theme + live counts of drafts/findings/cards
  # awaiting the PM. Route double-guards NZ weekends.
  # ⚠️ sync:false does NOT auto-fill: after first deploy, link the
  #    me-shared-cron-secret env group to this service in the Render dashboard.
  - type: cron
    name: pm-daily-todo
    env: node
    schedule: "0 19 * * 0-4"
    buildCommand: ""
    startCommand: |
      curl -fsS --max-time 120 -H "Authorization: Bearer $CRON_SECRET" \
        https://app.magicengine.com.au/api/cron/pm-daily-todo
    envVars:
      - key: CRON_SECRET
        sync: false

  # CTS title executor — Monday 05:30 UTC, right after oztop-seo-optimizer.
  # GSC pos-4-20 pages → AI title/desc → narrow-lane edit of the site repo's
  # meta data file → ONE weekly PR (human merges, client repo CI gates).
  # ⚠️ sync:false does NOT auto-fill: after first deploy, link the
  #    me-shared-cron-secret env group to this service in the Render dashboard.
  - type: cron
    name: cts-seo-optimizer
    env: node
    schedule: "30 5 * * 1"
    buildCommand: ""
    startCommand: |
      curl -fsS --max-time 300 -X POST -H "Authorization: Bearer $CRON_SECRET" \
        https://app.magicengine.com.au/api/cron/cts-seo-optimizer
    envVars:
      - key: CRON_SECRET
        sync: false

  # Weekly blog draft — Tuesday 3am UTC (after Monday keyword snapshots +
  # Monday AI tracker runs, so both topic-selection legs are fresh).
  # One auto-topic draft per client with seo_config.weekly_blog=true.
  # Drafts await human review in Blog Studio — never auto-publishes.
  # ⚠️ sync:false does NOT auto-fill: after first deploy, link the
  #    me-shared-cron-secret env group to this service in the Render
  #    dashboard, or every run 401s silently (daily-cron-digest lesson).
  # Reference: ROADMAP.md 22.E.S16
  - type: cron
    name: blog-weekly
    env: node
    schedule: "0 3 * * 2"
    buildCommand: ""
    startCommand: |
      curl -fsS --max-time 900 -H "Authorization: Bearer $CRON_SECRET" \
        https://app.magicengine.com.au/api/cron/blog-weekly
    envVars:
      - key: CRON_SECRET
        sync: false

  # Reference: ROADMAP.md § Phase 22.E · docs/seo-sop-implementation-design.md
  # healthchecks.io: seo-patrol-daily (db58fff5-fd32-45e0-a7fd-b067bede6689)
  - type: cron
    name: seo-patrol-daily
    env: node
    schedule: "0 4 * * *"
    buildCommand: ""
    startCommand: |
      curl -fsS --max-time 300 -H "Authorization: Bearer $CRON_SECRET" \
        https://app.magicengine.com.au/api/cron/seo-patrol-daily \
        && curl -fsS "https://hc-ping.com/db58fff5-fd32-45e0-a7fd-b067bede6689"
    envVars:
      - key: CRON_SECRET
        sync: false

  # Social comment auto-reply — every 30 min for enabled clients.
  # Pulls recent FB Page comments → classify → guardrailed auto reply (public +
  # optional DM) / hide spam. 30-min cadence keeps DM private_replies inside
  # Meta's 7-day window. Kill switch: SOCIAL_COMMENT_AUTOREPLY_KILL=1
  # Reference: ROADMAP.md P20.D (social pillar / DAPE Execution)
  - type: cron
    name: social-comment-autoreply
    env: node
    schedule: "*/30 * * * *"
    buildCommand: ""
    startCommand: |
      curl -fsS --max-time 900 -H "Authorization: Bearer $CRON_SECRET" \
        https://app.magicengine.com.au/api/cron/social-comment-autoreply
    envVars:
      - key: CRON_SECRET
        sync: false

  # ── 内容工厂:发布最后一米 ────────────────────────────────────────────────
  # 这两个 cron 的 route 早已实现(PR #592)但从未注册,approved 的成片因此停在
  # 「已通过·待发布」永远不动 —— 工厂链路的最后一段一直是断的。
  #
  # 🔴 安全阀:未设 FACTORY_PUBLISH_LIVE=true 时**只发草稿**(video_state=DRAFT,
  #    不公开),供 PM 验格式。验完 PM 显式 go 才在 Render 设 true 真发客户主页(不可逆)。
  # 发布正文在 publish-worker 内另有红线闸(scanPublishCaption),命中即终态不发。
  - type: cron
    name: factory-publish-worker
    env: node
    schedule: "*/10 * * * *"   # 一轮领 1 条(FB 视频上传慢),10 分钟一轮够用
    buildCommand: ""
    startCommand: |
      curl -fsS --max-time 300 -H "Authorization: Bearer $CRON_SECRET" \
        https://app.magicengine.com.au/api/cron/factory-publish-worker
    envVars:
      - key: CRON_SECRET
        sync: false

  # 自动排产 — 工厂的「开始按钮」。整条链是 下单→做片→审片→发布,前三段都在跑,
  # 但此前**没有任何东西会自动创建工单**(唯一入口 /api/factory/signals 无调用方),
  # 所以工厂修得再好也不会自己动。每天给开了 auto_order_enabled 的客户各下一单。
  # 🔴 按客户显式开关、默认关(自动下单=自动花钱)。余额下限/日单量/日花费上限
  #    全部沿用 strategist 既有护栏,不另开口子。dedupe_key 按 NZ 日切天 = 一天一单。
  # 20:00 UTC ≈ 08:00 NZST,落在 NZ 当天早上,当天有一整天可以出片+审片。
  - type: cron
    name: factory-order-scheduler
    env: node
    schedule: "0 20 * * *"
    buildCommand: ""
    startCommand: |
      curl -fsS --max-time 120 -H "Authorization: Bearer $CRON_SECRET" \
        https://app.magicengine.com.au/api/cron/factory-order-scheduler
    envVars:
      - key: CRON_SECRET
        sync: false

  # 素材池自动补货 — 治「所有 AI 画面从同一张种子图长出来」。
  # 没有这条 cron,stock-pipeline 就是零调用方的死代码:素材池永远停在手工灌的那几张,
  # sourceImagePool 恒空 → worker 每段都退回同一张 seed/cts_source.jpg。
  # 🔴 花钱路径:抓取按张计费(≈$0.002/张)。护栏在 lib 层且天然收敛 ——
  #    只给配了 factory_config 的客户抓 · 池子够 24 张就跳过 · 每客户最多 3 词×12 张 ·
  #    搜索词必须能溯源到 master_brief(拼不出就不抓)。单次全量最坏 $0.2 量级。
  # 每周一 19:00 UTC ≈ 周二 07:00 NZST,赶在当天 08:00 排产之前把池子补好。
  - type: cron
    name: factory-stock-refill
    env: node
    schedule: "0 19 * * 1"
    buildCommand: ""
    startCommand: |
      curl -fsS --max-time 300 -H "Authorization: Bearer $CRON_SECRET" \
        https://app.magicengine.com.au/api/cron/factory-stock-refill
    envVars:
      - key: CRON_SECRET
        sync: false

  # 卡死回收:publishing 超 10 分钟(进程被杀/超时)→ 退回 approved 等下轮重领。
  # 没有它,一次崩溃就会让那条工单永远卡在 publishing,没人能再领。
  - type: cron
    name: factory-publish-sweeper
    env: node
    schedule: "*/15 * * * *"
    buildCommand: ""
    startCommand: |
      curl -fsS --max-time 120 -H "Authorization: Bearer $CRON_SECRET" \
        https://app.magicengine.com.au/api/cron/factory-publish-sweeper
    envVars:
      - key: CRON_SECRET
        sync: false

  # 客户私信 → 需求卡。PR #652/#653 把这两条接口合进来了,但没有人调用它们,
  # 「客户消息」页会永远是空的 —— 这里补上调用方。
  #
  # 一个服务串两步,不是两个:brief 必须在 sync 之后跑(没入库的对话没得总结),
  # 用 && 串起来顺序天然保证,也省一个 Render cron 服务。
  # sync 失败时 brief 不会跑 —— 这是想要的:宁可这一轮不出卡,也不要基于半截
  # 数据写卡给销售看。
  #
  # 只同步 clients.facebook_page_id 有值的客户(设置页里选主页才会有值),
  # 所以新增客户不需要动这里。
  # 跑在每小时第 10 分钟,避开整点那一堆日更 cron。
  # max-time 跟接口的 maxDuration 对齐(sync 600s / brief 800s)再留一点余量。
  - type: cron
    name: messenger-hourly
    env: node
    schedule: "10 * * * *"
    buildCommand: ""
    startCommand: |
      curl -fsS --max-time 620 -H "Authorization: Bearer $CRON_SECRET" \
        https://app.magicengine.com.au/api/cron/messenger-sync-hourly \
      && curl -fsS --max-time 820 -H "Authorization: Bearer $CRON_SECRET" \
        https://app.magicengine.com.au/api/cron/messenger-brief-hourly
    envVars:
      - key: CRON_SECRET
        sync: false

  # Facebook 即时表单 → CRM。之前这条路只有人手一条(导 CSV 跑 import-cts-fb-leads.ts),
  # 2026-07-30 查出来的后果:CTS 的 CRM 里最后一个新人停在 7/25,而 Meta 后台
  # 7/26–7/30 又进了 27 个人,销售的「今天该联系谁」里一个都没有。
  #
  # 只同步 clients.facebook_page_id 有值的客户(跟私信同步同一个开关),
  # 所以新增客户不需要动这里。
  # 跑在每小时第 25 分钟:避开整点那一堆日更 cron,也避开第 10 分钟的私信同步
  # ——两条都会调 Meta Graph,岔开跑不容易撞上 Meta 的限流。
  - type: cron
    name: meta-leads-hourly
    env: node
    schedule: "25 * * * *"
    buildCommand: ""
    startCommand: |
      curl -fsS --max-time 620 -H "Authorization: Bearer $CRON_SECRET" \
        https://app.magicengine.com.au/api/cron/meta-leads-sync
    envVars:
      - key: CRON_SECRET
        sync: false

  # 做片拼片 worker — 常驻容器(node+python-PIL+ffmpeg)轮询 content_factory_render_jobs，
  # 领排队任务 → 分镜 → 画面(gpt-image+Muapi i2v) → 配音(MiniMax) → ffmpeg 拼竖屏成片 → 标待审。
  # 独立服务的原因：单条 i2v/拼接跑 15-30 分钟，塞不进 web 请求。
  # ⚠️ 部署后需在 Render 填 sync:false 密钥；首跑验证中文字体(NotoSansCJK ttc)PIL 能读。
  - type: worker
    name: content-factory-render-worker
    env: docker
    dockerfilePath: ./scripts/render-worker/Dockerfile
    plan: starter
    envVars:
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: MUAPI_API_KEY
        sync: false
      - key: CF_AIG_TOKEN
        sync: false
      - key: FACTORY_CJK_FONT
        value: /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc

  # 邮件反应 → CRM：谁收到了、谁打开了、谁点了行程链接。
  #
  # 这条接口 2026-07 就写好了（PR #686），但**从来没被注册**，一次都没跑过 ——
  # 2026-08-01 体检才发现：销售看不到「谁点了行程链接」，只能按「我们打没打过他」排序。
  #
  # ⚠️ 密钥用 fromGroup 自动挂，**不要**改回 `sync: false`：
  # 手挂密钥是这个仓库反复踩的坑 —— meta-leads-hourly 上线当天就因为手挂的值跟接口
  # 对不上，连着两小时 401、库里一条运行记录都没有；更早还有一条 cron 因此哑了 51 天。
  # 环境变量组 `me-shared-cron-secret` 已存在（Render 的 Link Environment Group 里能选到）。
  # 万一 Render 不认这个写法，回退方案是 `- key: CRON_SECRET` + `sync: false`，
  # 然后**必须**手动 link 同一个组 —— 别只填一个手打的值。
  - type: cron
    name: mailchimp-activity-daily
    env: node
    schedule: "40 4 * * *"
    buildCommand: ""
    startCommand: |
      curl -fsS --max-time 620 -H "Authorization: Bearer $CRON_SECRET" \
        https://app.magicengine.com.au/api/cron/mailchimp-activity-sync
    envVars:
      - fromGroup: me-shared-cron-secret

  # ─────────────────────────────────────────────────────────────────────────
  # Team Working Memory 兜底清扫 — 每 30 分钟
  #
  # 本机 hook 在会话结束时会自己触发提炼，这条 cron 是兜底：
  # 笔记本睡了 / 断网 / 进程被杀导致那一枪没打中的会话，在这里补上；
  # 顺带把被推翻的教训撤下、连续砸锅的套路下架（PM 选了全自动，收拾也得机器做）。
  #
  # ⚠️ 部署后必须在 Render 后台把这个 cron 关联到 me-shared-cron-secret 环境变量组。
  #    sync:false 不会自动填值 —— daily-cron-digest 就是因为这个哑了 51 天没人发现，
  #    而 digest 只报「失败」不报「没跑」，所以静默失效不会有任何告警。
  - type: cron
    name: team-memory-sweeper
    env: node
    schedule: "*/30 * * * *"
    buildCommand: ""
    startCommand: |
      curl -fsS --max-time 300 -X POST -H "Authorization: Bearer $CRON_SECRET" \
        https://app.magicengine.com.au/api/cron/team-memory-sweeper
    envVars:
      - key: CRON_SECRET
        sync: false
