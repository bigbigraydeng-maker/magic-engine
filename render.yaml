services:
  - type: web
    name: magic-engine
    env: node
    plan: standard
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ATLAS_API_KEY
        sync: false
      - key: HEYGEN_API_KEY
        sync: false
      - key: HEYGEN_DEFAULT_AVATAR_ID
        sync: false
      - key: HEYGEN_DEFAULT_VOICE_ID
        sync: false
      - key: SEMRUSH_API_KEY
        sync: false
      - key: SEMRUSH_DB
        value: au
      - key: DATAFORSEO_LOGIN
        sync: false
      - key: DATAFORSEO_PASSWORD
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: PUBLER_API_KEY
        sync: false
      - key: PUBLER_WORKSPACE_ID
        sync: false
      - key: PERPLEXITY_API_KEY
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        value: https://app.magicengine.com.au
      - key: APP_URL
        value: https://app.magicengine.com.au
      - key: OPENAI_BASE_URL
        value: https://gateway.ai.cloudflare.com/v1/bbd84393da8e5707ba617749dc17117c/magic-engine/openai
      - key: ANTHROPIC_BASE_URL
        value: https://gateway.ai.cloudflare.com/v1/bbd84393da8e5707ba617749dc17117c/magic-engine/anthropic
      - key: YOUTUBE_API_KEY
        sync: false
      - key: CLOUDFLARE_MGMT_TOKEN
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: CLIENT_VIEWERS
        sync: false
      - key: RENDER_EXTERNAL_URL
        fromService:
          type: web
          name: magic-engine
          property: host

  # Vision Asset Intelligence analyzer — every 2 minutes
  # Picks up pending client_assets, runs GPT-4o-mini Vision, writes scores.
  # Reference: ROADMAP.md P21.B.3
  - type: cron
    name: vision-analyzer
    env: node
    schedule: "*/2 * * * *"
    buildCommand: ""
    startCommand: |
      curl -s -X POST -H "Authorization: Bearer $CRON_SECRET" \
        https://app.magicengine.com.au/api/cron/vision-analyzer
    envVars:
      - key: CRON_SECRET
        sync: false

  # Poll visual generation jobs every 2 minutes
  - type: cron
    name: poll-visual-jobs
    env: node
    schedule: "*/2 * * * *"
    buildCommand: ""
    startCommand: |
      curl -s -H "Authorization: Bearer $CRON_SECRET" \
        https://app.magicengine.com.au/api/cron/poll-visual-jobs
    envVars:
      - key: CRON_SECRET
        sync: false

  # Site Audit job maintenance (cleanup, watchdog, recovery)
  # Runs daily at 2 AM UTC (~2 PM NZST)
  # Functionality:
  #   - Cleanup: Delete jobs completed > 30 days ago
  #   - Watchdog: Detect and log failed jobs (status='failed' with error_message)
  #   - Recovery: Resume pending jobs stuck > 1 hour
  # Reference: ROADMAP.md P8.0.5.6
  - type: cron
    name: site-audit-cron
    env: node
    schedule: "0 2 * * *"
    buildCommand: ""
    startCommand: |
      curl -s -X POST -H "x-cron-secret: $CRON_SECRET" \
        https://app.magicengine.com.au/api/cron/site-audit-jobs
    envVars:
      - key: CRON_SECRET
        sync: false

  # Flywheel attribution job — every 6 hours
  # Computes baseline/after/verdict for every flywheel_action with an expected_metric.
  # Reference: ROADMAP.md P12.A.9
  - type: cron
    name: attribution-cron
    env: node
    schedule: "0 */6 * * *"
    buildCommand: ""
    startCommand: |
      curl -s -X POST -H "Authorization: Bearer $CRON_SECRET" \
        https://app.magicengine.com.au/api/cron/attribution
    envVars:
      - key: CRON_SECRET
        sync: false

  # Zhangqian discovery sweeper — every 5 minutes
  # Marks stuck pending/running discovery jobs (>10 min) as failed.
  # The status route's stale check is reactive (UI-poll driven), so jobs
  # whose UI was closed mid-run would otherwise sit running forever.
  - type: cron
    name: zhangqian-sweeper
    env: node
    schedule: "*/5 * * * *"
    buildCommand: ""
    startCommand: |
      curl -s -H "Authorization: Bearer $CRON_SECRET" \
        https://app.magicengine.com.au/api/cron/zhangqian-sweeper
    envVars:
      - key: CRON_SECRET
        sync: false

  # Blog generation sweeper — every 5 minutes
  # Marks blog_posts stuck at status='generating' (>10 min) as failed.
  # Background generation in /api/clients/[id]/blog is fire-and-forget;
  # if Render restarts mid-run, rows would otherwise sit generating forever.
  # Reference: ROADMAP.md P14.C.1
  - type: cron
    name: blog-stuck-generating-sweeper
    env: node
    schedule: "*/5 * * * *"
    buildCommand: ""
    startCommand: |
      curl -s -H "Authorization: Bearer $CRON_SECRET" \
        https://app.magicengine.com.au/api/cron/blog-stuck-generating
    envVars:
      - key: CRON_SECRET
        sync: false

  # Weekly AI Visibility Tracker — every Monday at 1am UTC (~1pm NZST)
  # Processes all clients with enabled queries; writes runs + weekly snapshot.
  # Reference: ROADMAP.md P7.4.13
  - type: cron
    name: ai-tracker-weekly
    env: node
    schedule: "0 1 * * 1"
    buildCommand: ""
    startCommand: |
      curl -s -H "Authorization: Bearer $CRON_SECRET" \
        https://app.magicengine.com.au/api/cron/ai-tracker-weekly
    envVars:
      - key: CRON_SECRET
        sync: false

  # Daily Industry AI Visibility Archive — every day at 2:30am UTC (~2:30pm NZST)
  # Runs all 10+ industry questions × 3 platforms (ChatGPT / Google AI Overview /
  # Google SERP), upserts one snapshot per (question, platform, collected_date).
  # PM decision 2026-06-04: daily (not weekly) — only daily granularity captures
  # brand churn within the week. Cost ~$0.06/day for 10 seed questions.
  # Migration 20260622000003 enabled daily UNIQUE constraint.
  - type: cron
    name: industry-ai-visibility-daily
    env: node
    schedule: "30 2 * * *"
    buildCommand: ""
    startCommand: |
      curl -s -H "Authorization: Bearer $CRON_SECRET" \
        https://app.magicengine.com.au/api/cron/ai-visibility-weekly
    envVars:
      - key: CRON_SECRET
        sync: false

  # Phase 31 A2.1-γ — Goal current_value refresh
  # Daily 03:00 UTC (~15:00 NZST), runs AFTER industry-ai-visibility-daily (02:30 UTC)
  # so ai_visibility_score Goals read today's snapshots (not yesterday's).
  # Spec: docs/superpowers/specs/2026-06-04-a21-stepc-design-v3.md (v3.1)
  - type: cron
    name: goal-current-value-refresh
    env: node
    schedule: "0 3 * * *"
    buildCommand: ""
    startCommand: |
      curl -s -H "Authorization: Bearer $CRON_SECRET" \
        https://app.magicengine.com.au/api/cron/goal-current-value-refresh
    envVars:
      - key: CRON_SECRET
        sync: false

  # Weekly SEO keyword snapshots — every Monday at 2am UTC (~2pm NZST)
  # Stores DataForSEO ranked keyword rows for SEO Intelligence trends.
  # Reference: ROADMAP.md P12.I.8
  - type: cron
    name: keyword-snapshots-weekly
    env: node
    schedule: "0 2 * * 1"
    buildCommand: ""
    startCommand: |
      curl -s -H "Authorization: Bearer $CRON_SECRET" \
        https://app.magicengine.com.au/api/cron/keyword-snapshots-weekly
    envVars:
      - key: CRON_SECRET
        sync: false

  # Daily social engagement pullback — every day at 4am UTC
  # Pulls Publer post likes/comments/shares into flywheel_metrics.
  # Reference: ROADMAP.md P12.C.3
  - type: cron
    name: social-engagement-pullback
    env: node
    schedule: "0 4 * * *"
    buildCommand: ""
    startCommand: |
      curl -s -H "Authorization: Bearer $CRON_SECRET" \
        https://app.magicengine.com.au/api/cron/social-engagement-pullback
    envVars:
      - key: CRON_SECRET
        sync: false

  # Daily Google data pullback — every day at 3am UTC (~3pm NZST)
  # Syncs GSC + GA4 snapshots for all clients with connected Google connectors.
  # Reference: ROADMAP.md P17.A.4
  - type: cron
    name: google-data-pullback-daily
    env: node
    schedule: "0 3 * * *"
    buildCommand: ""
    startCommand: |
      curl -s -H "Authorization: Bearer $CRON_SECRET" \
        https://app.magicengine.com.au/api/cron/google-data-pullback-daily
    envVars:
      - key: CRON_SECRET
        sync: false

  # Weekly 诸葛亮 recalculation — every Monday at 3am UTC
  # Re-runs priority analysis for all clients with confirmed discovery,
  # writes fresh recommendations to execution_items kanban.
  # Reference: ROADMAP.md P24.B
  - type: cron
    name: zhuge-weekly-recalculate
    env: node
    schedule: "0 3 * * 1"
    buildCommand: ""
    startCommand: |
      curl -s -H "Authorization: Bearer $CRON_SECRET" \
        https://app.magicengine.com.au/api/cron/zhuge-recalculate
    envVars:
      - key: CRON_SECRET
        sync: false

  # Viral reference analyzer worker — every 2 minutes
  # Throttled queue drainer: picks up to 8 pending videos, runs Gemini analysis
  # sequentially with 5s delay between calls. Without this, viral-discovery would
  # burst 150+ concurrent Gemini calls and hit paid-tier TPM cap (1M tok/min).
  - type: cron
    name: viral-analyzer-worker
    env: node
    schedule: "*/2 * * * *"
    buildCommand: ""
    startCommand: |
      curl -s -X POST -H "Authorization: Bearer $CRON_SECRET" \
        https://app.magicengine.com.au/api/cron/viral-analyzer-worker
    envVars:
      - key: CRON_SECRET
        sync: false

  # Daily viral YouTube discovery — every day at 0am UTC (~12pm NZST)
  # 8 industries × 6 keyword groups × limit 20 = up to ~960 videos/day.
  # Auto-deduplicates, inserts new rows, kicks off Gemini analysis.
  # Quota cost ~5,760 units/day (free tier = 10,000/day).
  - type: cron
    name: viral-discovery-weekly
    env: node
    schedule: "0 0 * * *"
    buildCommand: ""
    startCommand: |
      curl -s -X POST -H "Authorization: Bearer $CRON_SECRET" \
        https://app.magicengine.com.au/api/cron/viral-discovery-weekly
    envVars:
      - key: CRON_SECRET
        sync: false

  # Daily anomaly detector — every day at 5am UTC (~5pm NZST / 3pm AEST)
  # Two-step pipeline:
  #   Step 1: AnomalyDetectorJob — scans flywheel_metrics, writes anomaly_signals
  #   Step 2: 诸葛亮 Proactive — reads fresh signals, creates proactive execution tasks
  # Reference: ROADMAP.md § Phase 22.D.3
  - type: cron
    name: anomaly-detector-daily
    env: node
    schedule: "0 5 * * *"
    buildCommand: ""
    startCommand: |
      curl -s -H "Authorization: Bearer $CRON_SECRET" \
        https://$RENDER_EXTERNAL_URL/api/cron/anomaly-detector
    envVars:
      - key: CRON_SECRET
        sync: false
      - key: RENDER_EXTERNAL_URL
        fromService:
          type: web
          name: magic-engine
          property: host

  # SEO Patrol — Phase 22.E.S2b
  #   Daily SEO opportunity engine: reads keyword_snapshots + GSC snapshots,
  #   runs the rule engine, persists fresh findings, and routes the top 3 onto
  #   the SEO kanban column via 诸葛亮's persister (source='zhuge').
  #   Runs after google-data-pullback-daily (3am) so data is fresh.
  # Reference: ROADMAP.md § Phase 22.E · docs/seo-sop-implementation-design.md
  - type: cron
    name: seo-patrol-daily
    env: node
    schedule: "0 4 * * *"
    buildCommand: ""
    startCommand: |
      curl -s -H "Authorization: Bearer $CRON_SECRET" \
        https://$RENDER_EXTERNAL_URL/api/cron/seo-patrol-daily
    envVars:
      - key: CRON_SECRET
        sync: false
      - key: RENDER_EXTERNAL_URL
        fromService:
          type: web
          name: magic-engine
          property: host
