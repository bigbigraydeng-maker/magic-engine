services:
  - type: web
    name: magic-engine
    env: node
    plan: standard
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ATLAS_API_KEY
        sync: false
      - key: HEYGEN_API_KEY
        sync: false
      - key: HEYGEN_DEFAULT_AVATAR_ID
        sync: false
      - key: HEYGEN_DEFAULT_VOICE_ID
        sync: false
      - key: SEMRUSH_API_KEY
        sync: false
      - key: SEMRUSH_DB
        value: au
      - key: PUBLER_API_KEY
        sync: false
      - key: PUBLER_WORKSPACE_ID
        sync: false
      - key: PERPLEXITY_API_KEY
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        value: https://crazycontent-27u3.onrender.com
      - key: ADMIN_EMAILS
        sync: false
      - key: CLIENT_VIEWERS
        sync: false
      - key: RENDER_EXTERNAL_URL
        fromService:
          type: web
          name: magic-engine
          property: host

  - type: background
    name: magic-engine-tasks
    env: node
    plan: standard
    buildCommand: npm install
    startCommand: npm run process-tasks
    envVars:
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ATLAS_API_KEY
        sync: false
      - key: SEMRUSH_API_KEY
        sync: false
      - key: PUBLER_API_KEY
        sync: false
      - key: CRON_SECRET
        sync: false

  # Poll visual generation jobs every 2 minutes
  - type: cron
    name: poll-visual-jobs
    env: node
    schedule: "*/2 * * * *"
    buildCommand: ""
    startCommand: |
      curl -s -H "Authorization: Bearer $CRON_SECRET" \
        https://$RENDER_EXTERNAL_URL/api/cron/poll-visual-jobs
    envVars:
      - key: CRON_SECRET
        sync: false
      - key: RENDER_EXTERNAL_URL
        fromService:
          type: web
          name: magic-engine
          property: host

  # Site Audit job maintenance (cleanup, watchdog, recovery)
  # Runs daily at 2 AM UTC (~2 PM NZST)
  # Functionality:
  #   - Cleanup: Delete jobs completed > 30 days ago
  #   - Watchdog: Detect and log failed jobs (status='failed' with error_message)
  #   - Recovery: Resume pending jobs stuck > 1 hour
  # Reference: ROADMAP.md P8.0.5.6
  - type: cron
    name: site-audit-cron
    env: node
    schedule: "0 2 * * *"
    buildCommand: ""
    startCommand: |
      curl -s -X POST -H "x-cron-secret: $CRON_SECRET" \
        https://$RENDER_EXTERNAL_URL/api/cron/site-audit-jobs
    envVars:
      - key: CRON_SECRET
        sync: false
      - key: RENDER_EXTERNAL_URL
        fromService:
          type: web
          name: magic-engine
          property: host

  # Flywheel attribution job — every 6 hours
  # Computes baseline/after/verdict for every flywheel_action with an expected_metric.
  # Reference: ROADMAP.md P12.A.9
  - type: cron
    name: attribution-cron
    env: node
    schedule: "0 */6 * * *"
    buildCommand: ""
    startCommand: |
      curl -s -X POST -H "Authorization: Bearer $CRON_SECRET" \
        https://$RENDER_EXTERNAL_URL/api/cron/attribution
    envVars:
      - key: CRON_SECRET
        sync: false
      - key: RENDER_EXTERNAL_URL
        fromService:
          type: web
          name: magic-engine
          property: host

  # Weekly AI Visibility Tracker — every Monday at 1am UTC (~1pm NZST)
  # Processes all clients with enabled queries; writes runs + weekly snapshot.
  # Reference: ROADMAP.md P7.4.13
  - type: cron
    name: ai-tracker-weekly
    env: node
    schedule: "0 1 * * 1"
    buildCommand: ""
    startCommand: |
      curl -s -H "Authorization: Bearer $CRON_SECRET" \
        https://$RENDER_EXTERNAL_URL/api/cron/ai-tracker-weekly
    envVars:
      - key: CRON_SECRET
        sync: false
      - key: RENDER_EXTERNAL_URL
        fromService:
          type: web
          name: magic-engine
          property: host
