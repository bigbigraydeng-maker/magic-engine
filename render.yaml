  # Weekly aggregator: takes the previous ISO week (Mon 00:00 UTC → Mon 00:00 UTC)
  # of flywheel_outcomes + zhuge_feedback_events and writes ONE summary
  # preference per active client into client_learned_preferences. Next agent run
  # reads it via loadMemoryForClient so "what worked / what got dismissed last
