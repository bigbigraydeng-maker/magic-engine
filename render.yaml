services:

  # ⚠️ 本 blueprint 不定义 web 服务。
  #
  # 对外的生产 Web 服务是 Render 上的 `crazycontent`(srv-d79s6d95pdvs73boptcg),
  # 它持有 app.magicengine.com.au / magicengine.com.au / magicengine.cloud 三个域名、
  # 55 个环境变量(含 CRON_SECRET 与全部 API key),从 bigbigraydeng-maker/magic-engine
  # 的 main 分支自动部署,归属另一个 blueprint。
  #
  # 这里原本还定义了一个同仓同分支的 web 服务 `magic-engine` —— 它没有域名、
  # 环境变量只配了 16 个(缺 CRON_SECRET 和所有 API key),从未对外服务过,
  # 只是每次 push 都构建一次、失败一次、发一封告警邮件。已于 2026-07-25 移除。
  # 下面的 cron 全部 curl app.magicengine.com.au,即打到 crazycontent,与此无关。

  # NOTE: Voice Agent realtime link runs IN-PROCESS inside the web service (MVP mode) —
  # the webhook opens the OpenAI realtime WebSocket directly, so NO separate worker
  # service is needed. To scale it out later, deploy scripts/voice/realtime-worker.ts as
  # a Render private service and set REALTIME_WORKER_URL on the web service to its
  # internal URL (see docs/voice-agent/RUNBOOK.md).

  # Cron consolidation (2026-10-24).
  #
  # Render bills each cron service a $1/month minimum. The previous per-endpoint
  # crons are replaced by three ticks. Each tick curls one dispatcher route,
  # which returns immediately and runs whichever existing handlers are due.
  # Individual /api/cron/* routes stay in place for manual runs and rollback.
  #
  # Do not sync this blueprint until the web service serving
  # app.magicengine.com.au is already running this commit. Syncing deletes the
  # old cron services defined by the previous blueprint. Dashboard-only crons
  # (lecture-publish, mailbox-sync-hourly, and the paused orphans) are NOT in
  # this file and must be deleted by hand. See the PR description.
  #
  # Secret: fromGroup, not sync:false. A new cron with sync:false has an empty
  # CRON_SECRET and 401s forever (mailbox-sync-hourly).
  #
  # Still paused, and not dispatched. The old commented blocks (schedule and
  # curl) are in git history before this file was collapsed. Restoring one
  # means putting it back in DISPATCH_CATALOG and CRON_REGISTRY, and removing
  # it from UNSCHEDULED_CRON_ROUTES, plus the extra step named here:
  # - job-boards-weekly: also turn on JOB_SIGNAL_INGEST_ENABLED (Places spend).
  # - execution-auto-run: PM decides whether to drop ?dry_run=1.
  # - factory-stock-refill: wire stock-transform into a caller first.
  # - team-memory-sweeper: reinstall the local hook (scripts/team-memory/README.md).
  # - email-reply-digest: PM stopped it on 2026-09-03; do not resume without that call.
  # - oztop-seo-optimizer: suspended on Render with no runs for 30 days as of 2026-10-24.

  - type: cron
    name: cron-dispatch-frequent
    env: node
    schedule: "*/5 * * * *"
    buildCommand: ""
    buildFilter:
      ignoredPaths:
        - "**/*"
    startCommand: |
      curl -fsS --max-time 60 -X POST -H "Authorization: Bearer $CRON_SECRET" \
        "https://app.magicengine.com.au/api/cron/dispatch-frequent"
    envVars:
      - fromGroup: me-shared-cron-secret

  - type: cron
    name: cron-dispatch-daily
    env: node
    schedule: "*/5 * * * *"
    buildCommand: ""
    buildFilter:
      ignoredPaths:
        - "**/*"
    startCommand: |
      curl -fsS --max-time 60 -X POST -H "Authorization: Bearer $CRON_SECRET" \
        "https://app.magicengine.com.au/api/cron/dispatch-daily"
    envVars:
      - fromGroup: me-shared-cron-secret

  - type: cron
    name: cron-dispatch-weekly
    env: node
    schedule: "*/5 * * * *"
    buildCommand: ""
    buildFilter:
      ignoredPaths:
        - "**/*"
    startCommand: |
      curl -fsS --max-time 60 -X POST -H "Authorization: Bearer $CRON_SECRET" \
        "https://app.magicengine.com.au/api/cron/dispatch-weekly"
    envVars:
      - fromGroup: me-shared-cron-secret
