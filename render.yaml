services:

  # ⚠️ 本 blueprint 不定义 web 服务。
  #
  # 对外的生产 Web 服务是 Render 上的 `crazycontent`(srv-d79s6d95pdvs73boptcg),
  # 它持有 app.magicengine.com.au / magicengine.com.au / magicengine.cloud 三个域名、
  # 55 个环境变量(含 CRON_SECRET 与全部 API key),从 bigbigraydeng-maker/magic-engine
  # 的 main 分支自动部署,归属另一个 blueprint。
  #
  # 这里原本还定义了一个同仓同分支的 web 服务 `magic-engine` —— 它没有域名、
  # 环境变量只配了 16 个(缺 CRON_SECRET 和所有 API key),从未对外服务过,
  # 只是每次 push 都构建一次、失败一次、发一封告警邮件。已于 2026-07-25 移除。
  # 下面的 cron 全部 curl app.magicengine.com.au,即打到 crazycontent,与此无关。

  # NOTE: Voice Agent realtime link runs IN-PROCESS inside the web service (MVP mode) —
  # the webhook opens the OpenAI realtime WebSocket directly, so NO separate worker
  # service is needed. To scale it out later, deploy scripts/voice/realtime-worker.ts as
  # a Render private service and set REALTIME_WORKER_URL on the web service to its
  # internal URL (see docs/voice-agent/RUNBOOK.md).

  # Vision Asset Intelligence analyzer — every 10 minutes (降频于 2026-07-21, commit b9f8189)
  # Picks up pending client_assets, runs GPT-4o-mini Vision, writes scores.
  # Reference: docs/history/CHANGELOG.md (P21.B.3)
  # healthchecks.io: vision-analyzer (1b1cd19b-583a-41ac-baaa-c9415241d5e8)
  # 2026-08-03 降频 */10 → */30：24h 内 144 次运行全部零产出（client_assets
  # 无 pending 行，最新素材停在 2026-06-10）。非交互式批处理——客户传完素材就走，
  # 由 FDE 事后审阅，晚 30 分钟开始分析无感知。审计见 docs/audits/supabase-request-audit.md §8 P0-1
  # 2026-08-16 [OPS] 降频 */30 → 每小时第 50 分：30 天仍全程零产出（工厂未开工），
  # 且本任务本来就是非交互批处理，没人在前台等它。回滚：schedule 改回 "*/30 * * * *"。
  - type: cron
    name: vision-analyzer
    env: node
    schedule: "50 * * * *"
    buildCommand: ""
    startCommand: |
      curl -fsS --max-time 120 -X POST -H "Authorization: Bearer $CRON_SECRET" \
        https://app.magicengine.com.au/api/cron/vision-analyzer \
        && curl -fsS "https://hc-ping.com/1b1cd19b-583a-41ac-baaa-c9415241d5e8"
    envVars:
      - key: CRON_SECRET
        sync: false

  # Poll visual generation jobs every 10 minutes
  #
  # ⚠️ 2026-08-03 审计：本任务 24h 内 144 次运行同样零产出，但**刻意不降频**。
  # 它是用户点了「生成视频」之后在等的完成检查（ReelsStudio 的生成按钮会写
  # reels_drafts.status='video_generating'，另有 3 个接口写 visual_assets
  # generation_status='generating'），降频 = 让人干等。空跑只说明当下没人在生成，
  # 不代表可以放慢。别顺手把它跟隔壁三个一起降了。
  # healthchecks.io: poll-visual-jobs (0dd2b641-499f-4f2f-8b73-73085050a5f0)
  #
  # 🔴 2026-08-16 [OPS] 降频 */10 → 每小时第 15 分 —— **这一条直接推翻了上面那段
  #    2026-08-03 的「刻意不降频」结论**，由 PM 在省钱盘点里显式点名要降，不是顺手带的。
  #    代价说清楚：用户在 ReelsStudio 点完「生成视频」后，成片最坏要等 60 分钟才在界面
  #    上变成完成态（此前最坏 10 分钟）。生成本身照跑，慢的只是「什么时候被看见」。
  #    工厂开工 / 有人开始天天用生成按钮时，这一条要第一个改回去。
  #    回滚：schedule 改回 "*/10 * * * *"。
  - type: cron
    name: poll-visual-jobs
    env: node
    schedule: "15 * * * *"
    buildCommand: ""
    startCommand: |
      curl -fsS --max-time 60 -H "Authorization: Bearer $CRON_SECRET" \
        https://app.magicengine.com.au/api/cron/poll-visual-jobs \
        && curl -fsS "https://hc-ping.com/0dd2b641-499f-4f2f-8b73-73085050a5f0"
    envVars:
      - key: CRON_SECRET
        sync: false

  # Site Audit job maintenance (cleanup, watchdog, recovery)
  # Runs daily at 2 AM UTC (~2 PM NZST)
  # Functionality:
  #   - Cleanup: Delete jobs completed > 30 days ago
  #   - Watchdog: Detect and log failed jobs (status='failed' with error_message)
  #   - Recovery: Resume pending jobs stuck > 1 hour
  # Reference: ROADMAP.md P8.0.5.6
  # healthchecks.io: site-audit-cron (8451084d-23c0-44b0-af00-8e29ff80fcdc)
  - type: cron
    name: site-audit-cron
    env: node
    schedule: "0 2 * * *"
    buildCommand: ""
    startCommand: |
      curl -fsS --max-time 120 -X POST -H "x-cron-secret: $CRON_SECRET" \
        https://app.magicengine.com.au/api/cron/site-audit-jobs \
        && curl -fsS "https://hc-ping.com/8451084d-23c0-44b0-af00-8e29ff80fcdc"
    envVars:
      - key: CRON_SECRET
        sync: false

  # Flywheel attribution job — every 6 hours
  # Computes baseline/after/verdict for every flywheel_action with an expected_metric.
  # Reference: ROADMAP.md P12.A.9
  # healthchecks.io: attribution-cron (87926446-35cf-4e5b-a868-bb784c27ee5f)
  - type: cron
    name: attribution-cron
    env: node
    schedule: "0 */6 * * *"
    buildCommand: ""
    startCommand: |
      curl -fsS --max-time 300 -X POST -H "Authorization: Bearer $CRON_SECRET" \
        https://app.magicengine.com.au/api/cron/attribution \
        && curl -fsS "https://hc-ping.com/87926446-35cf-4e5b-a868-bb784c27ee5f"
    envVars:
      - key: CRON_SECRET
        sync: false

  # Zhangqian discovery sweeper — every 5 minutes
  # Marks stuck pending/running discovery jobs (>10 min) as failed.
  # The status route's stale check is reactive (UI-poll driven), so jobs
  # whose UI was closed mid-run would otherwise sit running forever.
  # healthchecks.io: zhangqian-sweeper (071910fe-b9b7-435d-8b72-f141818eb03d)
  # 2026-08-03 降频 */15 → */30：24h 内 96 次运行全部零产出。纯超时兜底，从不干活。
  # 只降到 30 分钟而非每小时：超时阈值是 12 分钟（2026-08-25 从 6 分钟上调，见
  # src/lib/zhangqian/agent.ts 的 call budget 段），每小时跑会让真卡住的任务在
  # 界面上「运行中」挂最多 72 分钟，FDE 会误判系统坏了；30 分钟档最坏 42 分钟。
  # ⚠️ 2026-08-16 [OPS] 降频 */30 → 每小时第 35 分 —— 上面那句「不降到每小时」被 PM
  #    在省钱盘点里显式推翻。代价照旧成立：真卡住的发现任务在界面上最坏挂 72 分钟。
  #    工厂 / 发现线开工后若 FDE 反馈「看着像坏了」，第一步就是把这条改回去。
  #    回滚：schedule 改回 "*/30 * * * *"。
  - type: cron
    name: zhangqian-sweeper
    env: node
    schedule: "35 * * * *"
    buildCommand: ""
    startCommand: |
      curl -fsS --max-time 60 -H "Authorization: Bearer $CRON_SECRET" \
        https://app.magicengine.com.au/api/cron/zhangqian-sweeper \
        && curl -fsS "https://hc-ping.com/071910fe-b9b7-435d-8b72-f141818eb03d"
    envVars:
      - key: CRON_SECRET
        sync: false

  # Prospecting auto-sweep — every 10 minutes (Phase 35)
  # Advances the outbound conveyor one bounded step per fire:
  #   audit -> analyze -> draft -> discover next industry x NZ-city seed.
  # No-ops unless PROSPECTING_SWEEP_ENABLED=true on the web service (this cron only
  # curls; a flag set here would never be read). Ships dark; PM turns spend on.
  # Sending stays human — drafts land in the review queue only.
  - type: cron
    name: prospecting-sweep
    env: node
    schedule: "0 * * * *"
    buildCommand: ""
    startCommand: |
      curl -fsS --max-time 300 -H "Authorization: Bearer $CRON_SECRET" \
        https://app.magicengine.com.au/api/cron/prospecting-sweep
    envVars:
      - key: CRON_SECRET
        sync: false

  # Job-signal discovery — weekly (Mon 02:00 UTC ≈ Mon 2pm/3pm NZST).
  # Harvests NZ marketing-role postings (Seek), resolves each hiring company via
  # Places, inserts new ones as discovered(job_board). The prospecting-sweep then
  # audits/analyses/drafts them. No-ops unless JOB_SIGNAL_INGEST_ENABLED=true on
  # the web service (ships dark; PM turns it on). Sending stays human downstream.
  - type: cron
    name: job-boards-weekly
    env: node
    schedule: "0 2 * * 1"
    buildCommand: ""
    startCommand: |
      curl -fsS --max-time 300 -H "Authorization: Bearer $CRON_SECRET" \
        https://app.magicengine.com.au/api/cron/job-boards-weekly
    # 2026-08-16 [OPS] sync:false → fromGroup：密钥自动挂上，不用人去后台 link。
    # ⚠️ 这条的「30 天没跑成」根因**不是**密钥 —— 是主开关 JOB_SIGNAL_INGEST_ENABLED
    #    没开（route 在开关那里直接 return，走不到写运行记录那一步）。换 fromGroup 只是
    #    顺手排除掉第二个可能原因；真要让它干活，得 PM 决定开外呼线（花 Places 的钱 +
    #    开始碰真实 NZ 公司），不是这个 PR 能定的。
    envVars:
      - fromGroup: me-shared-cron-secret

  # Blog generation sweeper — every 5 minutes
  # Marks blog_posts stuck at status='generating' (>10 min) as failed.
  # Background generation in /api/clients/[id]/blog is fire-and-forget;
  # if Render restarts mid-run, rows would otherwise sit generating forever.
  # Reference: ROADMAP.md P14.C.1
  # healthchecks.io: blog-stuck-generating-sweeper (180d3e65-1910-4f8d-a778-409571d5fb46)
  # 2026-08-03 降频 */15 → */30：24h 内 96 次运行全部零产出（blog_posts 无 generating 行）。
  # 纯超时兜底，从不干活。同 zhangqian-sweeper，只降到 30 分钟：超时阈值 10 分钟，
  # 每小时跑会让卡住的文章在界面上「生成中」挂最多 70 分钟；30 分钟档最坏 40 分钟。
  # ⚠️ 2026-08-16 [OPS] 降频 */30 → 每小时第 45 分 —— 上面那句「不降到每小时」被 PM
  #    在省钱盘点里显式推翻。代价照旧成立：卡住的文章最坏「生成中」挂 70 分钟。
  #    回滚：schedule 改回 "*/30 * * * *"。
  - type: cron
    name: blog-stuck-generating-sweeper
    env: node
    schedule: "45 * * * *"
    buildCommand: ""
    startCommand: |
      curl -fsS --max-time 60 -H "Authorization: Bearer $CRON_SECRET" \
        https://app.magicengine.com.au/api/cron/blog-stuck-generating \
        && curl -fsS "https://hc-ping.com/180d3e65-1910-4f8d-a778-409571d5fb46"
    envVars:
      - key: CRON_SECRET
        sync: false

  # Marks tailor_made_jobs stuck at status='queued'/'running' (>10 min) as failed.
  # Same pattern as blog-stuck-generating-sweeper above: import/extract 建完任务行
  # 立刻回 202，AI 生成走 fire-and-forget；Render 部署重启会把半路的任务永远
  # 晾在 queued/running。getJob()/createOrReuseJob() 已经有惰性自愈（被轮询或
  # 被同一份行程再次建任务时会自动纠正），这个 cron 只兜底"从此没人再碰"的情况。
  # 见 CTS 2027 China Panorama 报障后续修复（tailor_made_jobs 表新增）。
  # 密钥用 fromGroup 自动挂，不要改回 `sync: false`——那条路径不会真的给新服务
  # 灌值，line ~980 那条 cron 的注释已经记过一次这个坑（连续 401 且没人发现）。
  # ⚠️ 没有配 healthchecks.io ping —— 没有权限新建 check，PM 有空的话在
  #    healthchecks.io 建一个再把 hc-ping 行加回来（参照上面 blog-stuck-generating 的写法）。
  - type: cron
    name: tailor-made-jobs-sweeper
    env: node
    schedule: "*/30 * * * *"
    buildCommand: ""
    startCommand: |
      curl -fsS --max-time 60 -H "Authorization: Bearer $CRON_SECRET" \
        https://app.magicengine.com.au/api/cron/tailor-made-jobs-sweeper
    envVars:
      - fromGroup: me-shared-cron-secret

  # Weekly AI Visibility Tracker — every Monday at 1am UTC (~1pm NZST)
  # Processes all clients with enabled queries; writes runs + weekly snapshot.
  # --max-time 30: route returns 202 immediately (fire-and-forget), so 30s is
  # plenty. Avoids Cloudflare 524 timeout that killed previous sync runs.
  # Reference: ROADMAP.md P7.4.13
  # healthchecks.io: ai-tracker-weekly (c4f101fe-c2cf-47f9-807f-08ea09d43934)
  # Schedule moved from Mon 01:00 UTC to Sun 18:00 UTC = Mon 06:00 NZST (PM decision 2026-09-16: NZ morning window).
  - type: cron
    name: ai-tracker-weekly
    env: node
    schedule: "0 18 * * 0"
    buildCommand: ""
    startCommand: |
      curl -fsS --max-time 30 -H "Authorization: Bearer $CRON_SECRET" \
        https://app.magicengine.com.au/api/cron/ai-tracker-weekly \
        && curl -fsS "https://hc-ping.com/c4f101fe-c2cf-47f9-807f-08ea09d43934"
    envVars:
      - key: CRON_SECRET
        sync: false

  # Daily Industry AI Visibility Archive — every day at 16:30 UTC (~4:30am NZST)
  # Runs all 10+ industry questions × 3 platforms (ChatGPT / Google AI Overview /
  # Google SERP), upserts one snapshot per (question, platform, collected_date).
  # PM decision 2026-06-04: daily (not weekly) — only daily granularity captures
  # brand churn within the week. Cost ~$0.06/day for 10 seed questions.
  # Migration 20260622000003 enabled daily UNIQUE constraint.
  # Schedule moved from 02:30 UTC to 16:30 UTC (PM decision 2026-09-16: run in NZ morning window so data is ready on wake-up).
  # healthchecks.io: industry-ai-visibility-daily (1400fe83-cc62-4634-9f7e-a2345553beee)
  - type: cron
    name: industry-ai-visibility-daily
    env: node
    schedule: "30 16 * * *"
    buildCommand: ""
    startCommand: |
      curl -fsS --max-time 600 -H "Authorization: Bearer $CRON_SECRET" \
        https://app.magicengine.com.au/api/cron/ai-visibility-weekly \
        && curl -fsS "https://hc-ping.com/1400fe83-cc62-4634-9f7e-a2345553beee"
    envVars:
      - key: CRON_SECRET
        sync: false

  # Phase 31 A2.1-γ — Goal current_value refresh
  # Daily 17:30 UTC (~5:30am NZST), runs AFTER industry-ai-visibility-daily (16:30 UTC)
  # so ai_visibility_score Goals read today's snapshots (not yesterday's).
  # Spec: docs/superpowers/specs/2026-06-04-a21-stepc-design-v3.md (v3.1)
  # Schedule moved from 03:00 UTC to 17:30 UTC (PM decision 2026-09-16: NZ morning window).
  # healthchecks.io: goal-current-value-refresh (300bb7f9-8a16-4a72-b9eb-a924dc76efa8)
  - type: cron
    name: goal-current-value-refresh
    env: node
    schedule: "30 17 * * *"
    buildCommand: ""
    startCommand: |
      curl -fsS --max-time 300 -H "Authorization: Bearer $CRON_SECRET" \
        https://app.magicengine.com.au/api/cron/goal-current-value-refresh \
        && curl -fsS "https://hc-ping.com/300bb7f9-8a16-4a72-b9eb-a924dc76efa8"
    envVars:
      - key: CRON_SECRET
        sync: false

  # Weekly SEO keyword snapshots — every Monday at 2am UTC (~2pm NZST)
  # Stores DataForSEO ranked keyword rows for SEO Intelligence trends.
  # Reference: ROADMAP.md P12.I.8
  # healthchecks.io: keyword-snapshots-weekly (db156874-3c69-4b5a-b534-a6bbea63a467)
  - type: cron
    name: keyword-snapshots-weekly
    env: node
    schedule: "0 2 * * 1"
    buildCommand: ""
    startCommand: |
      curl -fsS --max-time 900 -H "Authorization: Bearer $CRON_SECRET" \
        https://app.magicengine.com.au/api/cron/keyword-snapshots-weekly \
        && curl -fsS "https://hc-ping.com/db156874-3c69-4b5a-b534-a6bbea63a467"
    envVars:
      - key: CRON_SECRET
        sync: false

  # Weekly reputation snapshots — every Monday at 3:30am UTC (~3:30pm NZST)
  # GBP / Tripadvisor rating + review count + incremental reviews for active
  # clients with reputation identities configured (DataForSEO 计划 阶段 2).
  # ⚠️ 新 cron 上线后必须在 Render 后台 link "me-shared-cron-secret" env group，
  #    否则 CRON_SECRET 为空 → 每周 401 静默失败（daily-cron-digest 事故教训）。
  - type: cron
    name: reputation-snapshots-weekly
    env: node
    schedule: "30 3 * * 1"
    buildCommand: ""
    startCommand: |
      curl -fsS --max-time 900 -H "Authorization: Bearer $CRON_SECRET" \
        https://app.magicengine.com.au/api/cron/reputation-snapshots-weekly
    envVars:
      - key: CRON_SECRET
        sync: false

  # Daily social engagement pullback — every day at 4am UTC
  # Pulls Publer post likes/comments/shares into flywheel_metrics.
  # Reference: ROADMAP.md P12.C.3
  # healthchecks.io: social-engagement-pullback (01c469cc-4e77-4e88-bba4-7f17cbec91bc)
  - type: cron
    name: social-engagement-pullback
    env: node
    schedule: "0 4 * * *"
    buildCommand: ""
    startCommand: |
      curl -fsS --max-time 300 -H "Authorization: Bearer $CRON_SECRET" \
        https://app.magicengine.com.au/api/cron/social-engagement-pullback \
        && curl -fsS "https://hc-ping.com/01c469cc-4e77-4e88-bba4-7f17cbec91bc"
    envVars:
      - key: CRON_SECRET
        sync: false

  # Daily Winner Reel Auto-Sync — every day at 15:00 UTC (= 03:00 NZST, NZST=UTC+12)
  # Phase 34.A: scans a client's FB Page organic Reels, promotes winners into the
  # ThruPlay pool (new Ads default PAUSED, FDE approves). Migrated off GitHub Actions:
  # GHA scheduled workflows are best-effort and the 2026-07-11 15:00 UTC run never fired.
  # Render Cron Scheduler is a dedicated scheduler and fires reliably.
  # Reference: docs/sops/winner-reel-auto-sync.md · PR #542/#545
  # TODO(healthchecks): create a healthchecks.io monitor + append its hc-ping URL as a
  #   dead-man switch (emails if a run is missed). Left off until a UUID is provisioned;
  #   the cts-meta-daily-selfcheck scheduled task already flags a missed run in the interim.
  - type: cron
    name: winner-reel-sync-daily
    env: node
    schedule: "0 15 * * *"
    buildCommand: ""
    startCommand: |
      curl -fsS --max-time 300 -H "Authorization: Bearer $CRON_SECRET" \
        https://app.magicengine.com.au/api/cron/winner-reel-sync-daily
    envVars:
      - key: CRON_SECRET
        sync: false

  # Daily Google data pullback — every day at 3am UTC (~3pm NZST)
  # Syncs GSC + GA4 snapshots for all clients with connected Google connectors.
  # Reference: ROADMAP.md P17.A.4
  # Schedule moved from 03:00 UTC to 17:00 UTC (PM decision 2026-09-16: NZ morning window; runs 30 min after industry-ai-visibility-daily).
  # healthchecks.io: google-data-pullback-daily (12f3c5c4-4524-48b8-92c5-72fd2b775d01)
  - type: cron
    name: google-data-pullback-daily
    env: node
    schedule: "0 17 * * *"
    buildCommand: ""
    startCommand: |
      curl -fsS --max-time 900 -H "Authorization: Bearer $CRON_SECRET" \
        https://app.magicengine.com.au/api/cron/google-data-pullback-daily \
        && curl -fsS "https://hc-ping.com/12f3c5c4-4524-48b8-92c5-72fd2b775d01"
    envVars:
      - key: CRON_SECRET
        sync: false

  # Weekly 诸葛亮 recalculation — every Monday at 3am UTC
  # Re-runs priority analysis for all clients with confirmed discovery,
  # writes fresh recommendations to execution_items kanban.
  # Reference: ROADMAP.md P24.B
  # healthchecks.io: zhuge-weekly-recalculate (a2c4d128-e09c-41eb-843e-98c9a0afecba)
  - type: cron
    name: zhuge-weekly-recalculate
    env: node
    schedule: "0 3 * * 1"
    buildCommand: ""
    startCommand: |
      curl -fsS --max-time 900 -H "Authorization: Bearer $CRON_SECRET" \
        https://app.magicengine.com.au/api/cron/zhuge-recalculate \
        && curl -fsS "https://hc-ping.com/a2c4d128-e09c-41eb-843e-98c9a0afecba"
    envVars:
      - key: CRON_SECRET
        sync: false

  # Viral reference analyzer worker — every 2 minutes
  # Throttled queue drainer: picks up to 8 pending videos, runs Gemini analysis
  # sequentially with 5s delay between calls. Without this, viral-discovery would
  # burst 150+ concurrent Gemini calls and hit paid-tier TPM cap (1M tok/min).
  # healthchecks.io: viral-analyzer-worker (55891cbc-cfd5-4c58-b28b-f06206fade5a)
  - type: cron
    name: viral-analyzer-worker
    env: node
    schedule: "*/10 * * * *"
    buildCommand: ""
    startCommand: |
      curl -fsS --max-time 300 -X POST -H "Authorization: Bearer $CRON_SECRET" \
        https://app.magicengine.com.au/api/cron/viral-analyzer-worker \
        && curl -fsS "https://hc-ping.com/55891cbc-cfd5-4c58-b28b-f06206fade5a"
    envVars:
      - key: CRON_SECRET
        sync: false

  # Daily viral YouTube discovery — every day at 0am UTC (~12pm NZST)
  # 8 industries × 6 keyword groups × limit 20 = up to ~960 videos/day.
