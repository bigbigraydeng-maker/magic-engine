  # ─────────────────────────────────────────────────────────────────────────
  # ME product progress → LinkedIn — Monday + Thursday, ~9am NZ time
  #
  # No-ops unless LINKEDIN_PROGRESS_POST_ENABLED=true — this repo's web
  # service isn't Blueprint-managed (real prod is `crazycontent`, created by
  # hand in the Render dashboard), so this flag can't be declared here.
  # Absent = undefined !== 'true' = disabled by default, no dashboard action
  # needed to ship dark. PM sets LINKEDIN_PROGRESS_POST_ENABLED=true directly
  # on crazycontent's Environment tab when ready to turn it on.
  #
  # Schedule note: NZ is UTC+12/+13 (DST), so "Monday/Thursday 9am NZ" falls on
  # the PREVIOUS UTC calendar day (Sunday/Wednesday). 20:30 UTC lands at
  # roughly 8:30am NZDT–9:30am NZST year-round — good enough for a personal
  # LinkedIn post, not worth DST-exact scheduling for this.
  - type: cron
    name: linkedin-progress-post-mon
    env: node
    schedule: "30 20 * * 0"
    buildCommand: ""
    startCommand: |
      curl -fsS --max-time 60 -H "Authorization: Bearer $CRON_SECRET" \
        https://app.magicengine.com.au/api/cron/linkedin-progress-post-mon
    envVars:
      - fromGroup: me-shared-cron-secret

  - type: cron
    name: linkedin-progress-post-thu
    env: node
    schedule: "30 20 * * 3"
    buildCommand: ""
    startCommand: |
      curl -fsS --max-time 60 -H "Authorization: Bearer $CRON_SECRET" \
        https://app.magicengine.com.au/api/cron/linkedin-progress-post-thu
    envVars:
      - fromGroup: me-shared-cron-secret

  # Magic Insight（内部代号 market-intel）—— PM 每日全球 AI / 数字营销资讯雷达。
