<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CTS Tours — Tailor-made Itinerary</title>
<style>
/* ============================================================
   CTS TOURS — TAILOR-MADE ITINERARY TEMPLATE
   A4 print document. Pages are laid out by paginate() below,
   so a day never splits across a page break.
   Brand tokens mirror tailwind.config.ts.
   ============================================================ */
:root{
  --red:#B61E2E;
  --gold:#D6A756;
  --ink:#23201C;
  --muted:#5A554F;
  --cream:#FBF7F0;
  --line:#E4DCD0;
  --pad-x:16mm;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{
  background:#6f6a64;
  font-family:'Inter','Helvetica Neue',Helvetica,Arial,sans-serif;
  color:var(--ink);
  font-size:10pt;
  line-height:1.58;
  -webkit-font-smoothing:antialiased;
}
.serif{font-family:'Playfair Display',Georgia,'Times New Roman',serif}

/* ---------- sheet ---------- */
.sheet{
  width:210mm;height:297mm;background:#fff;
  margin:0 auto 10mm;position:relative;overflow:hidden;
  display:flex;flex-direction:column;
  box-shadow:0 8px 30px rgba(0,0,0,.32);
}
.sheet__band{flex:0 0 auto;height:2.4mm;display:flex}
.sheet__band i{display:block;height:100%}
.sheet__band i:nth-child(1){width:64%;background:var(--red)}
.sheet__band i:nth-child(2){width:36%;background:var(--gold)}

.sheet__head{
  flex:0 0 auto;height:17mm;padding:5mm var(--pad-x) 0;
  display:flex;align-items:flex-start;justify-content:space-between;
}
.sheet__head img{height:9mm;width:auto;display:block}
.sheet__head .hmeta{text-align:right;font-size:7pt;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);line-height:1.5;padding-top:1mm}
.sheet__head .hmeta b{display:block;color:var(--ink);font-weight:600;letter-spacing:.05em}

.sheet__body{flex:1 1 auto;padding:4mm var(--pad-x) 0;overflow:hidden;display:flex;flex-direction:column}
.sheet__body > *{flex:0 0 auto}

.sheet__foot{
  flex:0 0 auto;height:15mm;padding:3mm var(--pad-x) 0;margin:0 var(--pad-x);
  border-top:.5pt solid var(--line);
  display:flex;align-items:flex-start;justify-content:space-between;
  font-size:7pt;color:var(--muted);letter-spacing:.02em;
}
.sheet__foot .fnum{white-space:nowrap;padding-left:8mm}

/* ---------- cover ---------- */
.sheet--cover{padding:0}
.cover__img{
  flex:0 0 auto;height:176mm;position:relative;
  background:#2b2a28 center/cover no-repeat;
}
.cover__img::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(to bottom,rgba(35,32,28,.38) 0%,rgba(35,32,28,0) 30%,rgba(251,247,240,0) 68%,var(--cream) 97%);
}
.cover__eyebrow{
  position:absolute;top:14mm;left:var(--pad-x);z-index:2;
  color:#fff;font-size:7.6pt;letter-spacing:.24em;text-transform:uppercase;
  text-shadow:0 1px 6px rgba(0,0,0,.45);
}
.cover__panel{
  flex:1 1 auto;background:var(--cream);
  padding:9mm var(--pad-x) 13mm;
  display:flex;flex-direction:column;
}
.cover__logo{height:12mm;width:auto;align-self:flex-start;margin:0 0 7mm}
.cover__title{font-size:31pt;line-height:1.1;letter-spacing:-.01em;margin-bottom:4mm}
.cover__route{
  font-size:9.4pt;letter-spacing:.15em;text-transform:uppercase;color:var(--red);
  font-weight:600;margin-bottom:5mm;
}
.cover__rule{height:.5pt;background:var(--line);margin-bottom:5mm}
.cover__meta{display:flex;gap:12mm;font-size:9pt;color:var(--muted)}
.cover__meta b{display:block;font-size:7pt;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:.8mm}
.cover__meta span{color:var(--ink);font-weight:500}
.cover__prepared{
  margin-top:auto;padding-top:7mm;display:flex;justify-content:space-between;align-items:flex-end;
  font-size:8pt;color:var(--muted);
}
.cover__prepared .pfor{font-size:10pt;color:var(--ink)}
.cover__prepared .pfor b{display:block;font-size:7pt;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:1mm}

/* ---------- shared blocks ---------- */
.blk{margin-bottom:6mm}
.blk:last-child{margin-bottom:0}

.eyebrow{font-size:7pt;letter-spacing:.2em;text-transform:uppercase;color:var(--red);font-weight:700;margin-bottom:2mm}
h2.sec{font-size:17pt;line-height:1.2;margin-bottom:3mm}
h3.sub{font-size:10.5pt;font-weight:700;letter-spacing:.01em;margin-bottom:2mm}
p.lede{font-size:10.4pt;line-height:1.68;color:var(--muted)}

.ribbon{display:flex;flex-wrap:wrap;align-items:center;gap:0 2.5mm;font-size:9.6pt;font-weight:600}
.ribbon .c{color:var(--ink)}
.ribbon .s{color:var(--gold);font-weight:400}

.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:4mm 6mm}
.facts .f{border-top:1.4pt solid var(--red);padding-top:2mm}
.facts .f b{display:block;font-size:6.8pt;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:.8mm}
.facts .f span{font-size:9.4pt;font-weight:500;line-height:1.4;display:block}

ul.ticks{list-style:none}
ul.ticks li{position:relative;padding-left:6mm;margin-bottom:2mm;font-size:9.6pt;line-height:1.5}
ul.ticks li:last-child{margin-bottom:0}
ul.ticks li svg{position:absolute;left:0;top:1.1mm;width:3.4mm;height:3.4mm}

.callout{background:var(--cream);border-left:2.2pt solid var(--gold);padding:5mm 6mm}
.callout--red{border-left-color:var(--red)}

.specialist{display:flex;gap:6mm;align-items:flex-start;background:var(--cream);padding:6mm;border-top:2.2pt solid var(--red)}
.specialist .who{flex:1}
.specialist .who .nm{font-size:12pt;font-weight:600;line-height:1.3}
.specialist .who .rl{font-size:8.4pt;color:var(--muted);margin-bottom:2.5mm}
.specialist .who .ct{font-size:9.4pt;line-height:1.7}
.specialist .who .ct em{font-style:normal;color:var(--muted);display:inline-block;width:14mm}
.specialist .quote{width:64mm;font-size:9pt;line-height:1.6;color:var(--muted);border-left:.5pt solid var(--line);padding-left:6mm}

/* ---------- day card ---------- */
.day{display:flex;gap:6mm;padding-bottom:5mm;margin-bottom:5mm;border-bottom:.5pt solid var(--line)}
.day--last{border-bottom:0}
.day__no{
  flex:0 0 20mm;text-align:center;padding-top:1mm;
}
.day__no .n{
  font-family:'Playfair Display',Georgia,serif;font-size:19pt;line-height:1;
  color:var(--red);display:block;
}
.day__no .l{font-size:6.4pt;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);display:block;margin-top:1.2mm}
.day__main{flex:1 1 auto;min-width:0}
.day__head{display:flex;align-items:baseline;justify-content:space-between;gap:4mm;margin-bottom:1.6mm}
.day__route{font-family:'Playfair Display',Georgia,serif;font-size:13pt;line-height:1.2}
.day__date{font-size:8pt;color:var(--muted);white-space:nowrap;letter-spacing:.04em}
.day__body{font-size:9.5pt;line-height:1.62;color:#33302B}
.day__meta{display:flex;flex-wrap:wrap;gap:2mm 7mm;margin-top:3mm}
.day__meta .m{font-size:8.4pt;line-height:1.4;display:flex;gap:2mm;align-items:baseline}
.day__meta .m b{font-size:6.6pt;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:700;white-space:nowrap;padding-top:.2mm}
.day__meta .m span{color:var(--muted)}

/* ---------- two-column list ---------- */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:8mm}

/* ---------- price ---------- */
.price{display:flex;align-items:flex-end;justify-content:space-between;gap:8mm;background:var(--cream);padding:7mm;border-top:2.2pt solid var(--red)}
.price .amt{font-family:'Playfair Display',Georgia,serif;font-size:26pt;line-height:1;color:var(--red)}
.price .amt small{font-size:11pt;color:var(--muted);display:block;margin-top:2mm;font-family:'Inter','Helvetica Neue',Arial,sans-serif}
.price .amt b{display:block;font-size:6.8pt;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:1.6mm;font-family:'Inter','Helvetica Neue',Arial,sans-serif}
.price .amt .tbc{font-family:'Inter','Helvetica Neue',Arial,sans-serif;font-size:11pt;font-weight:500;color:var(--ink);line-height:1.45;display:block;max-width:82mm}
.price .basis{font-size:9pt;color:var(--muted);max-width:72mm;text-align:right;line-height:1.55}

table.opt{width:100%;border-collapse:collapse;font-size:9.4pt}
table.opt td{padding:2.6mm 0;border-bottom:.5pt solid var(--line)}
table.opt tr:last-child td{border-bottom:0}
table.opt td:last-child{text-align:right;font-weight:600;white-space:nowrap}

/* ---------- steps ---------- */
.steps{counter-reset:s}
.steps .st{display:flex;gap:5mm;margin-bottom:5mm}
.steps .st:last-child{margin-bottom:0}
.steps .st::before{
  counter-increment:s;content:counter(s);
  flex:0 0 8mm;height:8mm;border-radius:50%;background:var(--red);color:#fff;
  font-size:10pt;font-weight:700;display:flex;align-items:center;justify-content:center;
}
.steps .st .t{font-size:10.5pt;font-weight:600;margin-bottom:.8mm}
.steps .st .b{font-size:9.4pt;color:var(--muted);line-height:1.6}

.creds{display:flex;align-items:center;gap:7mm;flex-wrap:wrap}
.creds img{height:9mm;width:auto;opacity:.9}

.signoff{text-align:center;padding:8mm 0 4mm;margin-top:auto}
.signoff img{height:14mm;width:auto;margin-bottom:4mm}
.signoff .tag{font-size:8pt;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}

/* ---------- print ---------- */
@media print{
  @page{size:A4;margin:0}
  body{background:#fff}
  .sheet{margin:0;box-shadow:none;break-after:page;page-break-after:always}
  .sheet:last-child{break-after:auto;page-break-after:auto}
  #measure{display:none!important}
}
#measure{position:absolute;left:-9999px;top:0;width:178mm;visibility:hidden}
</style>
</head>

/* ============================================================
   FIRM DETAILS — change here, not in the markup.
   ============================================================ */
const CTS_FIRM = {
  name: 'CTS Tours',
  address: '2F CTS House, 175 Queen Street, Auckland',
  phone: '0800 287 888',
  email: 'info@ctstours.co.nz',
  web: 'www.ctstours.co.nz',
  tagline: 'Experience The Real Asia',
  heritage: 'China travel specialists for New Zealand · Heritage since 1928'
};

/* ---------- helpers ---------- */
const esc = s => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const el = html => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; };
const TICK = '<svg viewBox="0 0 16 16" fill="none" stroke="#B61E2E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.6l3.2 3.2L13 5"/></svg>';
const CROSS = '<svg viewBox="0 0 16 16" fill="none" stroke="#9A948B" stroke-width="2.2" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg>';

/* ---------- content blocks ---------- */
function coverSheet(d){
  const hero = d.trip.heroImage || CTS_ASSETS.hero;
  const s = el(`<section class="sheet sheet--cover"></section>`);
  s.innerHTML = `
    <div class="cover__img" style="background-image:url('${hero}')">
      <div class="cover__eyebrow">Tailor-made journey</div>
    </div>
    <div class="cover__panel">
      <img class="cover__logo" src="${CTS_ASSETS.logo}" alt="CTS Tours">
      <h1 class="cover__title serif">${esc(d.trip.title)}</h1>
      <div class="cover__route">${d.trip.route.map(esc).join(' &nbsp;·&nbsp; ')}</div>
      <div class="cover__rule"></div>
      <div class="cover__meta">
        <div><b>Dates</b><span>${esc(d.trip.dateRange)}</span></div>
        <div><b>Duration</b><span>${esc(d.trip.duration)}</span></div>
        <div><b>Travelling</b><span>${esc(d.client.travellers)}</span></div>
      </div>
      <div class="cover__prepared">
        <div class="pfor"><b>Prepared for</b>${esc(d.client.name)}</div>
        <div>Ref ${esc(d.meta.quoteRef)} &nbsp;·&nbsp; ${esc(d.meta.issuedDate)}</div>
      </div>
    </div>`;
  return s;
}

function blocks(d){
  const b = [];
  const push = (html, keepNext) => { const n = el(html); if (keepNext) n.dataset.keepNext = '1'; b.push(n); };

  /* --- at a glance --- */
  push(`<div class="blk">
      <div class="eyebrow">Your journey</div>
      <h2 class="sec serif">${esc(d.trip.title)}</h2>
      <div class="ribbon blk">${d.trip.route.map(c=>`<span class="c">${esc(c)}</span>`).join('<span class="s">→</span>')}</div>
      <p class="lede">${esc(d.trip.summary)}</p>
    </div>`, true);

  push(`<div class="blk facts">${
    d.trip.facts.map(f=>`<div class="f"><b>${esc(f.label)}</b><span>${esc(f.value)}</span></div>`).join('')
  }</div>`);

  if (d.trip.highlights && d.trip.highlights.length){
    push(`<div class="blk">
        <h3 class="sub">Trip highlights</h3>
        <ul class="ticks">${d.trip.highlights.map(h=>`<li>${TICK}${esc(h)}</li>`).join('')}</ul>
      </div>`, true);
  }

  const c = d.meta.consultant;
  push(`<div class="blk specialist">
      <div class="who">
        <div class="nm">${esc(c.name)}</div>
        <div class="rl">${esc(c.title)}</div>
        <div class="ct"><em>Phone</em>${esc(c.phone)}<br><em>Email</em>${esc(c.email)}</div>
      </div>
      <div class="quote">Every detail here can be changed. Tell me what you would like to see more of — or less of — and I will rework the itinerary until it is yours.</div>
    </div>`);

  /* --- day by day --- */
  push(`<div class="blk"><div class="eyebrow">Day by day</div><h2 class="sec serif">Your itinerary</h2></div>`, true);

  d.days.forEach((day, i) => {
    const meta = [];
    if (day.travel) meta.push(`<div class="m"><b>Travel</b><span>${esc(day.travel)}</span></div>`);
    if (day.accommodation) meta.push(`<div class="m"><b>Stay</b><span>${esc(day.accommodation)}</span></div>`);
    if (day.meals) meta.push(`<div class="m"><b>Meals</b><span>${esc(day.meals)}</span></div>`);
    push(`<div class="day${i === d.days.length-1 ? ' day--last' : ''}">
        <div class="day__no"><span class="n">${String(day.day).padStart(2,'0')}</span><span class="l">Day</span></div>
        <div class="day__main">
          <div class="day__head">
            <div class="day__route">${esc(day.route)}</div>
            <div class="day__date">${esc(day.date)}${day.weekday ? ' · ' + esc(day.weekday) : ''}</div>
          </div>
          <div class="day__body">${esc(day.body)}</div>
          ${meta.length ? `<div class="day__meta">${meta.join('')}</div>` : ''}
        </div>
      </div>`);
  });

  /* --- inclusions / exclusions --- */
  push(`<div class="blk"><div class="eyebrow">The detail</div><h2 class="sec serif">What is included</h2></div>`, true);
  push(`<div class="blk cols">
      <div>
        <h3 class="sub">Included</h3>
        <ul class="ticks">${d.inclusions.map(x=>`<li>${TICK}${esc(x)}</li>`).join('')}</ul>
      </div>
      <div>
        <h3 class="sub">Not included</h3>
        <ul class="ticks">${d.exclusions.map(x=>`<li>${CROSS}${esc(x)}</li>`).join('')}</ul>
      </div>
    </div>`);

  /* --- price --- */
  const p = d.pricing;
  const amount = (p.amount === null || p.amount === undefined || p.amount === '')
    ? `<b>Your price</b><span class="tbc">${esc(p.amountNote || 'Quotation to follow')}</span>`
    : `<b>Your price</b>${esc(p.currency)} $${Number(p.amount).toLocaleString('en-NZ')}<small>per person</small>`;
  push(`<div class="blk price"><div class="amt">${amount}</div><div class="basis">${esc(p.basis)}</div></div>`, true);

  if (p.optional && p.optional.length){
    push(`<div class="blk">
        <h3 class="sub">Costs to allow for</h3>
        <table class="opt">${p.optional.map(o=>`<tr><td>${esc(o.label)}</td><td>${esc(o.value)}</td></tr>`).join('')}</table>
      </div>`, true);
  }

  push(`<div class="blk callout callout--red">
      <h3 class="sub">Please note</h3>
      <ul class="ticks">${d.notes.map(n=>`<li>${TICK}${esc(n)}</li>`).join('')}</ul>
    </div>`);

  /* --- next steps --- */
  if (d.nextSteps && d.nextSteps.length){
    push(`<div class="blk"><div class="eyebrow">Next</div><h2 class="sec serif">Ready when you are</h2></div>`, true);
    push(`<div class="blk steps">${d.nextSteps.map(s=>`<div class="st"><div><div class="t">${esc(s.title)}</div><div class="b">${esc(s.body)}</div></div></div>`).join('')}</div>`);
  }

  push(`<div class="blk callout">
      <h3 class="sub">Talk to us</h3>
      <div style="font-size:9.6pt;line-height:1.75">
        ${esc(CTS_FIRM.name)} &nbsp;·&nbsp; ${esc(CTS_FIRM.address)}<br>
        ${esc(CTS_FIRM.phone)} &nbsp;·&nbsp; ${esc(CTS_FIRM.email)} &nbsp;·&nbsp; ${esc(CTS_FIRM.web)}
      </div>
    </div>`);

  push(`<div class="blk creds">
      <img src="${CTS_ASSETS.taanz}" alt="TAANZ">
      <img src="${CTS_ASSETS.iata}" alt="IATA">
      <img src="${CTS_ASSETS.qualmark}" alt="Qualmark">
      <img src="${CTS_ASSETS.tec}" alt="Tourism Export Council">
    </div>`);

  push(`<div class="signoff">
      <img src="${CTS_ASSETS.logo}" alt="CTS Tours">
      <div class="tag">${esc(CTS_FIRM.tagline)}</div>
    </div>`);

  return b;
}

/* ---------- pagination ---------- */
function newSheet(d){
  const s = el(`<section class="sheet"></section>`);
  s.innerHTML = `
    <div class="sheet__band"><i></i><i></i></div>
    <div class="sheet__head">
      <img src="${CTS_ASSETS.logo}" alt="CTS Tours">
      <div class="hmeta"><b>${esc(d.trip.title)}</b>Ref ${esc(d.meta.quoteRef)}</div>
    </div>
    <div class="sheet__body"></div>
    <div class="sheet__foot">
      <div>${esc(CTS_FIRM.name)} &nbsp;·&nbsp; ${esc(CTS_FIRM.phone)} &nbsp;·&nbsp; ${esc(CTS_FIRM.email)} &nbsp;·&nbsp; ${esc(CTS_FIRM.web)}</div>
      <div class="fnum"></div>
    </div>`;
  return s;
}

function render(){
  const d = CTS_ITINERARY;
  const doc = document.getElementById('doc');
  const measure = document.getElementById('measure');
  doc.innerHTML = '';

  doc.appendChild(coverSheet(d));

  const list = blocks(d);

  // measure every block at final content width
  list.forEach(n => measure.appendChild(n));
  const heights = list.map(n => {
    const r = n.getBoundingClientRect();
    const mb = parseFloat(getComputedStyle(n).marginBottom) || 0;
    return r.height + mb;
  });
  measure.innerHTML = '';

  // probe the usable body height
  const probe = newSheet(d);
  doc.appendChild(probe);
  const limit = probe.querySelector('.sheet__body').clientHeight;
  doc.removeChild(probe);

  const sheets = [];
  let sheet = newSheet(d), body = sheet.querySelector('.sheet__body'), used = 0;
  sheets.push(sheet);

  for (let i = 0; i < list.length; i++){
    const h = heights[i];
    const keepNext = list[i].dataset.keepNext === '1' && i + 1 < list.length;
    const needs = keepNext ? h + heights[i+1] : h;

    // a block taller than a page cannot be helped — let it start fresh and overflow is clipped
    if (used > 0 && used + needs > limit){
      sheet = newSheet(d); body = sheet.querySelector('.sheet__body'); used = 0;
      sheets.push(sheet);
    }
    body.appendChild(list[i]);
    used += h;
  }

  sheets.forEach(s => doc.appendChild(s));

  // page numbers — cover is page 1
  const total = sheets.length + 1;
  sheets.forEach((s, i) => { s.querySelector('.fnum').textContent = `Page ${i + 2} of ${total}`; });
}

render();
</script>
