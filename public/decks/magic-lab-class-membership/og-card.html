<!doctype html><html><head><meta charset="utf-8"><style>
  *{margin:0;box-sizing:border-box}
  html,body{width:1200px;height:1200px}
  .card{position:relative;width:1200px;height:1200px;overflow:hidden;
    background:linear-gradient(150deg,#0C2A54 0%,#0A1F40 52%,#07162F 100%);
    font-family:-apple-system,"PingFang SC","Helvetica Neue",sans-serif;color:#fff;}
  .glow{position:absolute;left:-160px;top:-160px;width:760px;height:760px;
    background:radial-gradient(circle at 30% 30%, rgba(54,197,255,.22), transparent 62%);}
  .wm{position:absolute;right:-150px;top:-180px;width:820px;opacity:.10;filter:brightness(0) invert(1);transform:rotate(8deg);}
  .pad{position:relative;z-index:2;padding:120px 110px;height:100%;display:flex;flex-direction:column;}
  .brand{display:flex;align-items:center;gap:22px;margin-bottom:70px;}
  .brand img{height:64px;filter:brightness(0) invert(1);}
  .brand span{font-size:50px;font-weight:800;letter-spacing:-.01em;}
  .eyebrow{display:inline-flex;align-items:center;gap:14px;font-size:30px;font-weight:600;color:#7FB6FF;letter-spacing:.06em;margin-bottom:40px;}
  .spark{color:#36C5FF;font-size:34px;}
  h1{font-size:128px;font-weight:800;line-height:1.05;letter-spacing:-.02em;margin-bottom:40px;}
  .grad{background:linear-gradient(120deg,#5AA0FF,#36C5FF);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
  .sub{font-size:44px;font-weight:500;color:#B9CDE8;line-height:1.4;max-width:700px;}
  .mascot{position:absolute;right:18px;bottom:-24px;height:540px;filter:drop-shadow(0 30px 60px rgba(0,10,40,.55));z-index:3;}
</style></head><body>
<div class="card">
  <div class="glow"></div>
  <img class="wm" src="ASSETS/mark-navy-t.png">
  <img class="mascot" src="ASSETS/mascot-full-cut.png">
  <div class="pad">
    <div class="brand"><img src="ASSETS/mark-navy-t.png"><span>Magic Lab Class</span></div>
    <div class="eyebrow"><span class="spark">✦</span>会员体系说明 · 2026</div>
    <h1>会员说明<br><span class="grad">澳新 AI 增长生态</span></h1>
    <div class="sub">面向澳大利亚与新西兰华人的<br>AI 学习 · 实践 · 合作 · 商业增长生态圈</div>
  </div>
</div>
</body></html>
