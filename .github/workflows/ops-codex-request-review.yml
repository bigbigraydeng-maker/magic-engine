name: OPS — Request Codex Review

# Part of the ME2-OPS02 Claude <-> Codex review loop. See
# tools/ops-review-loop/README.md for the full state diagram.
#
# This is the "push" leg only: whenever a qualifying PR gets a new head
# commit, ask the native Codex GitHub App to review it — exactly once per
# head sha. It posts one PR comment and nothing else. It never merges,
# deploys, applies a migration, or touches production data or credentials.
#
# WHY THIS USES OPS_REVIEW_PAT AND NOT THE BUILT-IN GITHUB_TOKEN
# --------------------------------------------------------------
# Codex Cloud resolves "@codex review" against the Codex account of the
# comment's *author*. github-actions[bot] has no Codex account, so every
# bot-authored request was answered with:
#
#   "To use Codex here, create a Codex account and connect to github"
#
# Observed on PR #898 (2026-08-11 12:38, 13:58) and PR #924 (2026-08-12
# 01:21, 02:52) — four requests, four refusals, zero reviews. The identical
# text posted by the Product Owner's own account on PR #898 at 04:11 got a
# real Codex review at 04:15. The workflow was never broken; the identity
# was. This answers ME2-OPS02 required validation #6/#7 with production
# evidence: a bot-authored request is NOT treated like a human one.
#
# OPS_REVIEW_PAT is a fine-grained PAT owned by the Product Owner, scoped to
# this single repository, with only Issues + Pull requests read/write — no
# contents write, no workflow, no admin. It is used ONLY to author this one
# comment. Everything else in this file still runs on GITHUB_TOKEN.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ops-codex-review-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  request-review:
    # Same-repo PRs only (a fork PR's GITHUB_TOKEN must stay read-only and
    # this workflow does not need to run for it), targeting main, on any
    # agent-authored claude/* branch, and still open.
    #
    # WHY claude/* HERE BUT claude/me2-* IN THE SIBLING WORKFLOW
    # ----------------------------------------------------------
    # These two legs carry very different blast radius, so they get different
    # scopes on purpose:
    #
    #   this file        posts ONE comment           → widening is free
    #   to-claude-fix    dispatches Claude to PUSH   → widening is not
    #
    # Every agent branch benefits from being reviewed, and a review request
    # cannot collide with anything. Auto-pushing is different: this repo runs
    # one window per branch (CLAUDE.md §6), so a fix dispatched onto a branch
    # another window is actively holding would fight that window for the same
    # working tree. That leg stays pinned to the ME2 lane, where the
    # one-window-per-Work-Package rule is explicit and enforced.
    if: |
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main' &&
      startsWith(github.event.pull_request.head.ref, 'claude/') &&
      github.event.pull_request.state == 'open'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Checked out from main, not the PR head: this control-plane script
      # must not be influenced by the PR it is reviewing (mirrors the
      # self-protection principle in tools/ai-orchestrator).
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      # Fail loudly instead of falling back to GITHUB_TOKEN. A fallback would
      # reproduce exactly the failure this change exists to remove: a green
      # workflow run whose comment Codex silently refuses. A red run that says
      # why is strictly better than a green run that achieves nothing.
      - name: Check the review-requester identity is configured
        env:
          OPS_REVIEW_PAT: ${{ secrets.OPS_REVIEW_PAT }}
        run: |
          if [ -z "$OPS_REVIEW_PAT" ]; then
            echo "::error::Repository secret OPS_REVIEW_PAT is not set."
            echo "::error::Codex ignores review requests authored by github-actions[bot]."
            echo "::error::Add a fine-grained PAT (this repo only; Issues + Pull requests: read/write) as OPS_REVIEW_PAT."
            exit 1
          fi

      - name: Request Codex review once per head sha
        env:
          # Read (dedup) with the ambient token; POST as the Product Owner.
          # Splitting them keeps the PAT's required grant to the single
          # permission it genuinely needs — see request-review.mjs for the live
          # 404 that motivated this.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEW_REQUEST_TOKEN: ${{ secrets.OPS_REVIEW_PAT }}
        run: node tools/ops-review-loop/src/request-review.mjs
