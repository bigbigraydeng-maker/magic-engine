name: factory-worker CI

# Runs the video factory worker's own tests on every pull request, so they are
# verified by GitHub and not only on a laptop.
#
# Why this exists: until now NO workflow ran anything under scripts/factory-worker.
# The repo's vitest suite (worker, recipe sequence, creative recipe, Remotion branch,
# music vocal gate, backfill tool) and the Remotion engine's node:test suite only ran
# on whoever's machine made the change, so "all checks green" said nothing about the
# files that decide what the factory renders and what it refuses to render.
#
# It runs on EVERY pull request, deliberately, with no path or branch filter. A filtered
# workflow that is also a required status check never reports on the PRs it skips and
# blocks them forever (same reasoning as ops-review-loop CI). It is read-only, needs no
# secrets and takes a few minutes.
#
# This is NOT a deploy and NOT a render. It never starts Chrome, never calls ffmpeg or any
# provider, never writes anything. The engine's real-render smoke test only runs when
# RUN_REMOTION_RENDER=1, which is deliberately not set here.
#
# There is deliberately no `secrets.` expression anywhere in this file.
#
# Check name: **factory-worker-tests** (the job name below). Adding it as a REQUIRED check
# in the `Protect main` ruleset is a separate repository-settings step, not part of this PR.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: factory-worker-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tests:
    name: factory-worker-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            scripts/factory-worker/engines/remotion/package-lock.json

      - name: Node version supports TypeScript type stripping (engine needs >= 22.18)
        run: |
          node --version
          node -e "const [a,b]=process.versions.node.split('.').map(Number); if (a<22 || (a===22 && b<18)) { console.error('Node >= 22.18 required'); process.exit(1) }"

      - name: Install root dependencies
        run: npm ci

      - name: Install Remotion engine dependencies (no install scripts, no browser download)
        working-directory: scripts/factory-worker/engines/remotion
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Worker tests (vitest)
        run: npx vitest run scripts/factory-worker --reporter=verbose

      - name: Remotion engine tests (node:test)
        working-directory: scripts/factory-worker/engines/remotion
        run: node --test test/*.test.mjs

      - name: Say what failed and how to reproduce it
        if: failure()
        run: |
          {
            echo '## factory-worker-tests failed'
            echo
            echo 'Reproduce on your machine:'
            echo
            echo '```'
            echo 'npx vitest run scripts/factory-worker'
            echo '(cd scripts/factory-worker/engines/remotion && npm ci --ignore-scripts && node --test test/*.test.mjs)'
            echo '```'
            echo
            echo 'These tests guard the music vocal gate, the text/red-line rescan wiring and the render refusals. Do not skip a failing one: fix the code or the test and say why.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Confirm the run changed nothing
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::CI modified the working tree. It must not."
            git status --porcelain
            exit 1
          fi
