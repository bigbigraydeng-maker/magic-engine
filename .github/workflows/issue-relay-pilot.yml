name: Issue Discussion Relay (pilot, Issue #910 only)

# ME2-OPS03 pilot. Lets Codex join the discussion on Issue #910 when Claude
# posts a comment there, or when the repository owner explicitly asks for a
# relay — replacing a human copying messages between chat windows, with a
# hard stop after 4 rounds. See tools/issue-relay/README.md for the full
# design (state diagram, identities, dedup, round cap, failure recovery,
# cost boundary) and its "Open verification items" section for what is
# best-effort pending confirmation against openai/codex-action@v1's actual
# documented interface, which this authoring session could not reach.
#
# Deliberately absent:
#   - `schedule:` / any polling — the Issue comment IS the trigger.
#   - any trigger other than `issue_comment.created` on this one issue.
#   - write scopes beyond posting an Issue comment (see `permissions:`).
#   - a `git commit` / `git push` anywhere in this file.
#
# This is NOT tools/ai-orchestrator and does not touch it, its workflows, or
# its tests. It is a separate, smaller, single-issue pilot.

on:
  issue_comment:
    types: [created]

# Least privilege: read the checkout (needed to build the small relay
# script), read/write Issue comments (needed to list history and post one
# reply). No `pull-requests`, no `id-token`, no `actions`, no `deployments` —
# even a misbehaving Codex step has no credential that can do more than post
# one Issue comment.
permissions:
  contents: read
  issues: write

# Serializes every run of this pilot so two comments landing close together
# can't both compute the same next round and both spend on it.
concurrency:
  group: me2-issue-relay-issue-910
  cancel-in-progress: false

jobs:
  relay:
    # Exact guards, evaluated before anything is checked out:
    #   - only Issue #910 (never any other issue, never a pull request);
    #   - never the workflow's own reply (default GITHUB_TOKEN identity).
    # `decide()` in tools/issue-relay/src/decide.ts re-checks the identity
    # and PR/issue distinction again from the fetched event, as defense in
    # depth against this `if:` ever being edited loosely.
    if: |
      github.event.issue.number == 910 &&
      github.event.issue.pull_request == null &&
      github.event.comment.user.login != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          fetch-depth: 1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build relay script
        run: npx tsc -p tools/issue-relay/tsconfig.build.json

      # Reads GITHUB_EVENT_PATH itself (never interpolates comment text into
      # a shell script — see tools/issue-relay/README.md "Prompt safety").
      # Decides skip / halt / relay and, for relay, writes a safely-delimited
      # prompt file. Posts nothing yet.
      - name: Decide
        id: prepare
        run: node tools/issue-relay/dist/cli.js prepare
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Post round-cap halt
        if: steps.prepare.outputs.decision == 'halt'
        run: node tools/issue-relay/dist/cli.js post-halt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SOURCE_COMMENT_ID: ${{ steps.prepare.outputs.source_comment_id }}

      # Presence-only check. Never echoes the secret's value.
      - name: Check for OPENAI_API_KEY
        id: preflight
        if: steps.prepare.outputs.decision == 'relay'
        run: |
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "::warning::OPENAI_API_KEY is not configured — reporting and stopping."
            echo "missing=true" >> "$GITHUB_OUTPUT"
          else
            echo "missing=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Report missing credentials
        if: steps.prepare.outputs.decision == 'relay' && steps.preflight.outputs.missing == 'true'
        run: node tools/issue-relay/dist/cli.js post-missing-credentials
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          MISSING_SECRET_NAME: OPENAI_API_KEY

      # UNVERIFIED against openai/codex-action@v1's actual action.yml — this
      # authoring session had no registry/web access to confirm input names.
      # See tools/issue-relay/README.md "Open verification items" #2.
      # Read-only/sandboxed per the issue's integration choice; Codex has no
      # tool that can write, commit, push, merge, deploy, or call a
      # production system, and `Confirm nothing changed on disk` below fails
      # the job if the working tree moved anyway.
      - name: Run Codex (read-only, discussion only)
        id: codex
        if: steps.prepare.outputs.decision == 'relay' && steps.preflight.outputs.missing == 'false'
        continue-on-error: true
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: ${{ steps.prepare.outputs.prompt_path }}
          sandbox: read-only
          output-file: ${{ runner.temp }}/codex-reply.txt

      - name: Report provider failure
        if: steps.codex.outcome == 'failure'
        run: node tools/issue-relay/dist/cli.js post-provider-failure
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Post Codex reply
        if: steps.codex.outcome == 'success'
        run: node tools/issue-relay/dist/cli.js post-relay
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ROUND: ${{ steps.prepare.outputs.round }}
          SOURCE_COMMENT_ID: ${{ steps.prepare.outputs.source_comment_id }}
          CODEX_REPLY_FILE: ${{ runner.temp }}/codex-reply.txt

      - name: Confirm nothing changed on disk
        if: always()
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::This job modified the working tree. Codex output is discussion text only."
            git status --porcelain
            exit 1
          fi
          echo "Working tree clean: no commit, no push, no repository change."
