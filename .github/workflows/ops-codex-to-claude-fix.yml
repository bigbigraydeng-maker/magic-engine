name: OPS — Codex Review to Claude Fix

# Part of the ME2-OPS02 Claude <-> Codex review loop. See
# tools/ops-review-loop/README.md for the full state diagram.
#
# This is the "review" leg: when Codex submits a review on a qualifying PR,
# decide (in tools/ops-review-loop/src/handle-review.mjs, unit-tested offline
# in tools/ops-review-loop/tests/) whether to dispatch one aggregated Claude
# fix task, post READY FOR PRODUCT OWNER, post NEEDS HUMAN REVIEW after 3
# rounds, or do nothing (dedup).
#
# ⚠️ THIS WORKFLOW CAN MERGE. Changed 2026-08-12 by explicit Product Owner
# decision, replacing the previous "nothing in this file can merge a PR".
# When Codex returns a positively-clean review AND every check run on the head
# sha is completed green AND the PR is not a draft AND it is mergeable, this
# merges it with no human in the loop. `main` auto-deploys to Render, so an
# auto-merge is an unreviewed production deploy.
#
# Kill switch: repository variable OPS_AUTO_MERGE_ENABLED. It must equal the
# string "true" for any merge to happen; anything else (including unset) makes
# the loop stop at READY FOR PRODUCT OWNER as before. It is a repository
# *variable* on purpose — workflow files are themselves auto-mergeable now, so
# a switch stored in one could be disabled by the very change it exists to
# stop, whereas a variable is outside anything this loop's token can write.
#
# It still never deploys directly, applies a migration, queries or modifies
# production data, or auto-resolves a review conversation.
#
# The actor allowlist is enforced by the `if:` guard below against
# `github.event.review.user.login`, a GitHub-verified field a commenter
# cannot forge — not by any input on the invoked action, since this leg
# calls claude-code-action directly with a prompt rather than via an
# @claude mention, so there is no comment-trigger surface to allowlist.

on:
  pull_request_review:
    types: [submitted]

permissions:
  # contents: write is required for the merge API and for nothing else here —
  # claude-code-action still authenticates its own push through the Claude
  # GitHub App behind CLAUDE_CODE_OAUTH_TOKEN, exactly as before. This was
  # `contents: read` until 2026-08-12; it was raised only because the Product
  # Owner turned auto-merge on. Setting OPS_AUTO_MERGE_ENABLED to false
  # disables merging without lowering it back.
  contents: write
  pull-requests: write
  checks: read
  actions: read
  id-token: write

concurrency:
  group: ops-codex-fix-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  handle-review:
    if: |
      contains(github.event.review.user.login, 'chatgpt-codex-connector') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main' &&
      startsWith(github.event.pull_request.head.ref, 'claude/me2-') &&
      github.event.pull_request.state == 'open'
    runs-on: ubuntu-latest
    # 10 minutes: "Decide next stage" can spend up to ~4 of these polling the
    # required check when Codex's clean review lands before CI finishes (see
    # tools/ops-review-loop/src/poll.mjs) — the two paths (poll vs. dispatch
    # Claude) are mutually exclusive within a single run, so this is headroom
    # for whichever one this run takes, not a sum of both.
    timeout-minutes: 10
    steps:
      # Checked out from main, not the PR head, for the same reason as the
      # sibling workflow: a PR must never be able to edit the script that
      # decides its own fate (dedup markers, round cap, CI gate).
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Decide next stage
        id: plan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Must be the exact string "true" to permit a merge. Unset reads as
          # disabled, so the capability cannot switch itself on by accident.
          AUTO_MERGE_ENABLED: ${{ vars.OPS_AUTO_MERGE_ENABLED }}
        run: node tools/ops-review-loop/src/handle-review.mjs

      # The only step in this file with any write access to repository
      # content, and only via the Claude GitHub App's own token — this
      # workflow's GITHUB_TOKEN grants contents: read, see above. Runs at
      # most 3 times per PR (enforced by plan.mjs / handle-review.mjs before
      # this step is reached), and only with the aggregated Codex findings
      # as its prompt.
      - name: Invoke Claude to fix Codex findings
        id: claude
        if: steps.plan.outputs.action == 'dispatch-fix'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          prompt: ${{ steps.plan.outputs.prompt }}

      # Codex finding (PR #906, P2): posting the fix-dispatched marker from
      # "Decide next stage", before this step ran, meant a timeout or failed
      # push still permanently consumed a round. This step runs regardless of
      # whether the step above succeeded (`always()`) and records the real
      # outcome — see tools/ops-review-loop/src/mark-fix-outcome.mjs.
      - name: Record fix round outcome
        if: always() && steps.plan.outputs.action == 'dispatch-fix'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ROUND: ${{ steps.plan.outputs.round }}
          OUTCOME: ${{ steps.claude.outcome }}
        run: node tools/ops-review-loop/src/mark-fix-outcome.mjs
