name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Install guards from the default branch, not the working tree.
      # Claude can edit the checkout after this step. The copies it is allowed
      # to run are root-owned and outside the repo, so those edits do not change
      # them. Tradeoff: the merged default-branch files are trusted. This job
      # does not verify a signature, and it does not add a separate sandbox.
      - name: Install Claude command guards
        env:
          # Only a PR-triggered run gets a PR number. An issue run pins an
          # empty file, and gh-resolve-thread then refuses every call.
          PR_NUMBER: ${{ github.event.pull_request.number || (github.event.issue.pull_request && github.event.issue.number) || '' }}
          REPO_FULL_NAME: ${{ github.repository }}
        run: |
          set -euo pipefail
          default_branch="${{ github.event.repository.default_branch }}"
          git fetch --depth=1 origin "$default_branch"
          tmp="$(mktemp -d)"
          git show "FETCH_HEAD:.github/scripts/gh-pr-create-draft.sh" > "$tmp/gh-pr-create-draft.sh"
          git show "FETCH_HEAD:.github/scripts/git-limited.sh" > "$tmp/git-limited.sh"
          git show "FETCH_HEAD:.github/scripts/git-command-config.sh" > "$tmp/git-command-config.sh"
          git show "FETCH_HEAD:.github/scripts/gh-resolve-thread.sh" > "$tmp/gh-resolve-thread.sh"
          if [[ -n "$PR_NUMBER" && ! "$PR_NUMBER" =~ ^[1-9][0-9]{0,9}$ ]]; then
            echo "unexpected PR number" >&2
            exit 1
          fi
          printf '%s\n' "$PR_NUMBER" > "$tmp/pr-number"
          printf '%s\n' "$REPO_FULL_NAME" > "$tmp/repo"
          # Threads Claude may resolve: only those it opened itself.
          # GraphQL login, no [bot] suffix. A person or Codex stays unresolved.
          # Ray 2026-10-31: the pinned list is exactly this one login.
          printf '%s\n' "claude" > "$tmp/resolve-thread-authors"
          printf '%s\n' "https://github.com/${{ github.repository }}.git" > "$tmp/origin-url"
          : > "$tmp/empty-gitconfig"
          sudo install -d -o root -g root -m 0755 /opt/claude-guards /opt/claude-guards/empty-gh
          sudo install -o root -g root -m 0755 "$tmp/gh-pr-create-draft.sh" /opt/claude-guards/gh-pr-create-draft
          sudo install -o root -g root -m 0755 "$tmp/git-limited.sh" /opt/claude-guards/git-limited
          sudo install -o root -g root -m 0755 "$tmp/gh-resolve-thread.sh" /opt/claude-guards/gh-resolve-thread
          sudo install -o root -g root -m 0644 "$tmp/pr-number" /opt/claude-guards/pr-number
          sudo install -o root -g root -m 0644 "$tmp/repo" /opt/claude-guards/repo
          sudo install -o root -g root -m 0644 "$tmp/resolve-thread-authors" /opt/claude-guards/resolve-thread-authors
          sudo install -o root -g root -m 0644 "$tmp/git-command-config.sh" /opt/claude-guards/git-command-config.sh
          sudo install -o root -g root -m 0644 "$tmp/origin-url" /opt/claude-guards/origin-url
          sudo install -o root -g root -m 0644 "$tmp/empty-gitconfig" /opt/claude-guards/empty-gitconfig
          rm -rf "$tmp"
          test "$(stat -c '%U:%a' /opt/claude-guards/gh-pr-create-draft)" = "root:755"
          test "$(stat -c '%U:%a' /opt/claude-guards/git-limited)" = "root:755"
          test "$(stat -c '%U:%a' /opt/claude-guards/gh-resolve-thread)" = "root:755"
          test "$(stat -c '%U:%a' /opt/claude-guards/pr-number)" = "root:644"
          test "$(stat -c '%U:%a' /opt/claude-guards/repo)" = "root:644"
          test "$(stat -c '%U:%a' /opt/claude-guards/resolve-thread-authors)" = "root:644"
          test "$(stat -c '%U:%a' /opt/claude-guards/git-command-config.sh)" = "root:644"
          test "$(stat -c '%U:%a' /opt/claude-guards/origin-url)" = "root:644"
          test "$(stat -c '%U:%a' /opt/claude-guards/empty-gitconfig)" = "root:644"
          test "$(stat -c '%U:%a' /opt/claude-guards/empty-gh)" = "root:755"
          test "$(stat -c '%U:%a' /opt/claude-guards)" = "root:755"
          test -x /usr/bin/gh
          test -x /usr/bin/git
          if [[ -w /opt/claude-guards || -w /opt/claude-guards/gh-pr-create-draft || -w /opt/claude-guards/git-limited || -w /opt/claude-guards/git-command-config.sh || -w /opt/claude-guards/empty-gh || -w /opt/claude-guards/origin-url || -w /opt/claude-guards/empty-gitconfig || -w /opt/claude-guards/gh-resolve-thread || -w /opt/claude-guards/pr-number || -w /opt/claude-guards/repo || -w /opt/claude-guards/resolve-thread-authors ]]; then
            echo "guard path is writable by the job user" >&2
            exit 1
          fi

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # v1 passes claude_args to the CLI. The documented flag is --allowedTools
          # (camelCase). The action merges this list with its built-in tools
          # (read, search, in-repo edits, git add/commit, and the no-flag push
          # wrapper). It does not replace them.
          # Pull requests are created only via the root-owned wrapper installed
          # above. It checks that value flags have values, puts --draft before
          # caller args, and rejects flags that can turn draft off. Raw
          # `gh pr create` is not allowed. No merge, no force-push, no raw
          # gh api / gh api graphql, no approve, no ready-for-review.
          # Review threads are resolved only through gh-resolve-thread: one
          # fixed mutation, one PRRT_ id, only on the PR that started this
          # run, only threads opened by the pinned login (claude).
          # fetch / checkout / switch / cherry-pick go through git-limited.
          # New branches (checkout -b / switch -c) must be claude/<name>.
          # Raw git prefixes are not allowed: flags such as --upload-pack run
          # a local command. The wrapper allows only those four subcommands,
          # a fixed https origin, and a short flag list. Before it runs git,
          # it parses config with NUL records and refuses keys that name a
          # program, including a subsection that contains "=". It also refuses
          # attribute values such as filter=<name> and merge=<custom driver>.
          # gh pr create is refused the same way: its git status runs clean
          # filters from the work tree, including when the command is started
          # from a subdirectory.
          # npm ci, npm test, and npm run type-check are exact commands.
          # Wildcards are omitted because npm accepts --script-shell and vitest
          # accepts --config, both of which run arbitrary code.
          # Job permissions stay as declared above. gh uses the Claude app token
          # minted in the action (it already requests pull request write), not
          # the read-only GITHUB_TOKEN from this job.
          # See https://github.com/anthropics/claude-code-action/blob/v1/docs/usage.md
          # and https://github.com/anthropics/claude-code-action/blob/v1/docs/configuration.md
          claude_args: |
            --allowedTools "Bash(/opt/claude-guards/git-limited:*),Bash(/opt/claude-guards/gh-pr-create-draft:*),Bash(/opt/claude-guards/gh-resolve-thread:*),Bash(gh pr view:*),Bash(npm ci),Bash(npm test),Bash(npm run type-check)"
            --append-system-prompt "This runner has guarded commands. Raw git checkout/switch/fetch/cherry-pick, raw gh api and gh pr create are refused. To make a new branch, run from the repo root: /opt/claude-guards/git-limited switch -c claude/<short-name> (lower case, one segment after claude/), then push with the push wrapper named in your instructions. Only make a new branch when the comment asks for a new branch or a new PR; otherwise push to the existing PR branch. To open a PR use /opt/claude-guards/gh-pr-create-draft (always a draft). To see unresolved review threads on this PR, run /opt/claude-guards/gh-resolve-thread --list. To resolve a thread you have actually fixed and pushed, run /opt/claude-guards/gh-resolve-thread PRRT_<id>; it only works on this PR and only on threads whose opener is claude. Threads opened by a person or by Codex are refused. Never resolve a thread you did not fix, and list every thread you resolved in your comment."

