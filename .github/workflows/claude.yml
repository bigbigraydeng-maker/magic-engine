name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # v1 passes claude_args to the CLI. The documented flag is --allowedTools
          # (camelCase). The action merges this list with its built-in tools
          # (read, search, in-repo edits, git add/commit, and the no-flag push
          # wrapper). It does not replace them.
          # gh pr create is prefix-locked to --draft. A create that does not
          # start with "gh pr create --draft" is denied. No merge, no force-push,
          # no gh api, no resolve-review-thread.
          # Job permissions stay as declared above. gh uses the Claude app token
          # minted in the action (it already requests pull request write), not
          # the read-only GITHUB_TOKEN from this job.
          # See https://github.com/anthropics/claude-code-action/blob/v1/docs/usage.md
          # and https://github.com/anthropics/claude-code-action/blob/v1/docs/configuration.md
          claude_args: |
            --allowedTools "Bash(git fetch:*),Bash(git checkout:*),Bash(git switch:*),Bash(git cherry-pick:*),Bash(gh pr create --draft:*),Bash(gh pr view:*),Bash(npm ci),Bash(npx vitest:*),Bash(npm test:*),Bash(npm run type-check)"

