name: ops-review-loop CI

# Ordinary read-only CI for tools/ops-review-loop. It runs the module's tests on
# pull requests, so the suite is verified by GitHub rather than only on a laptop.
#
# It runs on EVERY pull request, deliberately, with no path or branch filter.
# A filtered workflow that is also a required status check is a merge deadlock:
# GitHub does not run the workflow on a PR the filter excludes, so the required
# check never reports, sits Pending forever, and blocks a PR that has nothing to
# do with this module. The job is read-only, takes about a minute and needs no
# secrets. The job always reports; proven docs/sibling-tool changes skip heavy steps.
#
# Until now tools/ops-review-loop/tests ran only on laptops. This makes the
# control plane's own rules — including the protected-path list — a required
# check: delete a protected-path rule and the test goes red, not quietly green.
#
# This is NOT a trigger for the review loop. It never starts a run, never reads a
# model credential, never talks to OpenAI or Anthropic, never writes an Issue
# comment, and never commits, pushes or merges.
#
# There is deliberately no `secrets.` expression anywhere in this file.
#
# Required status check name: **ops-review-loop-tests** (the job name below).
# That is the string to enter in the `Protect main` ruleset.

on:
  # No `paths:`, no `paths-ignore:`, no `branches:`. See the note above — any of
  # them turns this into a check that never reports on the PRs it skips.
  pull_request:

# Read-only. The job reads the checkout and nothing else; it has no reason to
# write anything and is given no way to.
permissions:
  contents: read

# Newer pushes supersede in-flight runs for the same PR. Safe here in a way it is
# not for the review loop: cancelling a test run loses nothing.
concurrency:
  group: ops-review-loop-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tests:
    # Stable, distinctive check name. Renaming this breaks any ruleset that
    # requires it, so treat it as part of the repository's configuration surface.
    name: ops-review-loop-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Pinned to reviewed commit SHAs, never to moveable tags: `@v4` today and
      # `@v4` tomorrow are not guaranteed to be the same code.
      #
      # The PR head is the default ref here and is correct: this checks the PR's
      # own code, so it must run the code under review, not `main`.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Detect module check scope
        id: scope
        run: >-
          python3 .github/scripts/module-ci-scope.py ops-review-loop
          "${{ github.event.pull_request.base.sha }}"
          "${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.scope.outputs.run_heavy != 'false'
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        if: steps.scope.outputs.run_heavy != 'false'
        run: npm ci

      - name: Tests
        if: steps.scope.outputs.run_heavy != 'false'
        # Verbose so the check log names every governance assertion that ran,
        # including the protected-path rules this control plane enforces.
        run: npx vitest run tools/ops-review-loop --reporter=verbose

      - name: Explain skipped module work
        if: steps.scope.outputs.run_heavy == 'false'
        run: echo "Heavy module steps skipped - only Markdown docs or sibling tools changed." >> "$GITHUB_STEP_SUMMARY"

      - name: Confirm the run changed nothing
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::CI modified the working tree. It must not."
            git status --porcelain
            exit 1
          fi
          echo "Working tree clean: no commit, no push, no repository change."
