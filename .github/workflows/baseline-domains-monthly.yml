name: Phase 30 — Baseline Domains Monthly Collect

# 每月 1 号 03:00 UTC（NZST 16:00 / NZDT 17:00）跑 SeoCollector
# 重新采集所有 baseline_domains 的 SEO 分，写最新分 + 插历史快照。
#
# 也支持 workflow_dispatch 手工触发（用于调试或临时刷新）。
#
# 配置要求：
#   - GitHub repo Secrets 添加 CRON_SECRET（与 Render web 服务同值）
#   - 可选 BASELINE_CRON_URL（默认 https://app.magicengine.com.au/api/cron/baseline-domains-monthly）

on:
  schedule:
    - cron: '0 3 1 * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger baseline collect endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BASELINE_CRON_URL: ${{ secrets.BASELINE_CRON_URL || 'https://app.magicengine.com.au/api/cron/baseline-domains-monthly' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET secret not set"
            exit 1
          fi

          echo "Triggering: $BASELINE_CRON_URL"
          response=$(curl -fsSL -w "\nHTTP_STATUS:%{http_code}" \
            -X GET \
            -H "Authorization: Bearer $CRON_SECRET" \
            --max-time 480 \
            "$BASELINE_CRON_URL")

          status=$(echo "$response" | tail -n1 | sed 's/HTTP_STATUS://')
          body=$(echo "$response" | sed '$d')

          echo "Status: $status"
          echo "Body: $body"

          if [ "$status" != "200" ]; then
            echo "::error::Non-200 response from cron endpoint"
            exit 1
          fi
