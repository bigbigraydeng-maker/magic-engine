name: PR Merge Authorization

# Preventive merge control: a non-draft PR's exact current revision does not
# receive this required check until the protected GitHub Environment is
# approved. Configure `merge-authorization` with Ray as the sole required
# reviewer and disable administrator bypass before making this check required.
#
# 只改 docs/ledger/ 的 PR 免人工合并审批：这类 PR 不进入 merge-authorization 环境，
# 被跳过的 required check 在 GitHub 上算通过，所以它们不必等 Ray 点批准。
# 这是 PM 2026-09-25 拍板的；它们仍然要过 ledger-check.yml 里的 CI 检查（全绿才可合并）。
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-merge-authorization-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  detect-ledger-only:
    name: Detect ledger-only change
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      ledger_only: ${{ steps.detect.outputs.ledger_only }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Detect ledger-only change
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          changed=$(git diff --name-only "$base...$head")
          if [[ -n "$changed" ]] && ! grep -vqE '^docs/ledger/' <<<"$changed"; then
            echo "ledger_only=true" >> "$GITHUB_OUTPUT"
            echo "::notice::只改了 docs/ledger/，按 PM 2026-09-25 拍板免人工合并审批（CI 仍要全绿）。"
          else
            echo "ledger_only=false" >> "$GITHUB_OUTPUT"
          fi

  merge-authorization:
    name: Merge authorization (Ray)
    needs: detect-ledger-only
    if: github.event.pull_request.draft == false && needs.detect-ledger-only.outputs.ledger_only != 'true'
    environment:
      name: merge-authorization
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Bind approval receipt to this PR revision
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test -n "${PR_NUMBER}"
          test "${#PR_HEAD_SHA}" -eq 40
          {
            echo '## Merge authorization receipt'
            echo
            echo "- PR: #${PR_NUMBER}"
            echo "- Approved head: \`${PR_HEAD_SHA}\`"
            echo '- Authority: protected GitHub Environment review'
          } >> "${GITHUB_STEP_SUMMARY}"
