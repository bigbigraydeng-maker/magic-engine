name: Tour catalog boundary check

# 团目录边界检查（2026-10-12，PM 拍板「加」）。
#
# 为什么要有这个：
#   src/lib/tour-catalog/__tests__/boundary.test.ts 是「还没上架的改动不许漏到目录以外」这条
#   边界的执行者（目录以外的文件不得提及 tour_catalog_* 表，也不得从能碰草稿的模块导入），
#   但以前没有任何 workflow 跑它。2026-10-12 进主干的 CRM 付款进度（PR #2497）让它红了三条
#   （两个文件直接读目录的表、一个文件从 tour-catalog/http 导入），CI 全绿照样合了进去，
#   直到本机全量 `npx vitest run` 才发现。写在测试里的边界，没有程序去跑，就跟写在文档里一样。
#
# 🔴 跟 kernel-architecture.yml 同一套硬规矩，别顺手「优化」：
#   · 不许加 paths / branches 过滤：带过滤的检查，被过滤掉的 PR 永远等不到结果。
#   · 不许加 continue-on-error、`|| true` 之类让它「红了也算过」的写法。
#   · 改 job name 之前先确认它没被登记进 Protect main 的必过清单。
#
# 只读：不用任何仓库 secret，不评论不推送不部署。

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tour-catalog-boundary-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tour-catalog-boundary-test:
    name: Tour catalog boundary test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 跟 kernel-architecture 一样用默认的 merge ref（主干 + 本 PR）：这是全仓不变量，
      # 要测合进去以后的样子；只测 PR 头会放过「分叉之后主干才进来的违规文件」。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      # 这个测试自己会 `git ls-files` 扫全仓，所以必须在完整 checkout 下跑。
      - name: Run tour catalog boundary test
        env:
          RESULTS: ${{ runner.temp }}/tour-catalog-boundary-results.json
        run: >-
          npx vitest run src/lib/tour-catalog/__tests__/boundary.test.ts
          --reporter=verbose --reporter=json --outputFile.json="$RESULTS"
      # 光看退出码还不够，再核一遍：只跑了那一个真文件、零失败、零跳过、通过数不低于下限。
      # 下限写成 !(passed >= min)：结果里字段缺了，同样判红，不会因为「比较不成立」被放过。
      - name: Confirm the tests really ran
        env:
          RESULTS: ${{ runner.temp }}/tour-catalog-boundary-results.json
          # 加这道闸时的条数（2026-10-12：8）。边界测试只该越加越多；真要删测试，改这里同样要过 A 级审。
          MIN_PASSED: '8'
        run: |
          node -e '
            const path = require("path")
            const r = require(process.env.RESULTS)
            const min = Number(process.env.MIN_PASSED)
            const expected = path.join(process.env.GITHUB_WORKSPACE || process.cwd(), "src/lib/tour-catalog/__tests__/boundary.test.ts")
            const files = (r.testResults || []).map((t) => t.name)
            const skipped = r.numPendingTests + r.numTodoTests
            console.log(`files=${JSON.stringify(files)} passed=${r.numPassedTests} failed=${r.numFailedTests} skipped=${skipped} floor=${min}`)
            const problems = []
            if (files.length !== 1 || files[0] !== expected) problems.push(`跑的不是那一个真文件（应当只有 ${expected}）`)
            if (r.numFailedTests !== 0) problems.push(`有 ${r.numFailedTests} 条失败`)
            if (skipped !== 0) problems.push(`有 ${skipped} 条被跳过（skip / todo / 名字过滤）`)
            if (!(r.numPassedTests >= min)) problems.push(`只跑通了 ${r.numPassedTests} 条（下限 ${min}）`)
            for (const p of problems) console.log(`::error::边界测试没有完整跑过：${p}`)
            if (problems.length > 0) process.exit(1)
          '
