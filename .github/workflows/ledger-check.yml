name: Ledger check

# 台账检查（2026-09-24 审计）。
#
# 为什么要有这个：
#   审计发现仓库里记了 128 条教训，其中 73% 只存在于文字里 —— 没有任何程序读过它们，
#   所以「记了」和「没记」在机器看来完全一样，漏记永远不会被发现。
#   docs/ledger 是每个窗口都必须写台账的地方；这个检查把「记了」变成可机器验证的事实。
#
# 只读：不用任何仓库 secret，不评论不推送不部署。

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ledger-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ledger-entries-valid:
    # 格式永不豁免：任何 PR 的台账条目都必须合法。
    name: Ledger entries valid
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate ledger entries
        run: npx vitest run src/lib/ledger
      - name: Check frozen fields
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Bootstrap guard (2026-09-28, incident): this step's own definition comes
          # from a merge of base+head for `pull_request`-triggered workflows, but the
          # checkout above pins to the PR's own head.sha — so the moment this step
          # landed on main, every PR branch that had not yet merged in the script
          # (i.e. every PR open before this line existed) started failing a required
          # check for a script it never had a chance to include. Same bootstrap
          # exception `check-video-factory-bypass.mjs` (PR #2177) and
          # `ops-fix-scope-guard.yml` already use, for the same reason.
          if [ ! -f scripts/ledger-check-frozen.sh ]; then
            echo "::notice::scripts/ledger-check-frozen.sh not on this branch yet — treating as pre-existing PR, skipping (will re-run for real once the branch merges main)"
            exit 0
          fi
          bash scripts/ledger-check-frozen.sh

  code-change-has-ledger-entry:
    # dependabot 与夜巡分支豁免，避免机器提交被台账闸卡住。
    if: ${{ !startsWith(github.head_ref, 'dependabot/') && !startsWith(github.head_ref, 'claude/ledger-verify-') }}
    name: Code change has ledger entry
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require a ledger entry for code changes
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          # 三点比对 = 只看这个 PR 自己改了什么；两点比对会把主干这段时间的改动也算进来，主干一动就误拦
          changed=$(git diff --name-only "$base...$head")
          code=$(grep -E '^(src/|supabase/migrations/|scripts/|\.github/workflows/|render\.yaml$)' <<<"$changed" || true)
          ledger=$(grep -E '^docs/ledger/[^/]+\.md$' <<<"$changed" | grep -v 'README\.md' || true)

          if [[ -n "${code}" && -z "${ledger}" ]]; then
            echo '::error::这个 PR 改了代码（src/、supabase/migrations/、scripts/、.github/workflows/ 或 render.yaml）但没写台账。请在 docs/ledger/ 新增或更新一条（格式见 docs/ledger/README.md）。'
            echo 'Changed code files:'
            echo "${code}"
            exit 1
          fi

          {
            echo '## Ledger check'
            echo
            if [[ -n "${code}" ]]; then
              echo '- Code changed: yes'
            else
              echo '- Code changed: no'
            fi
            if [[ -n "${ledger}" ]]; then
              echo '- Ledger files touched:'
              echo "${ledger}" | sed 's/^/  - /'
            else
              echo '- Ledger files touched: none'
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

  ledger-refs-exist:
    # dependabot 与夜巡分支豁免。
    if: ${{ !startsWith(github.head_ref, 'dependabot/') && !startsWith(github.head_ref, 'claude/ledger-verify-') }}
    name: Ledger refs exist
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check ledger pointers
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash scripts/ledger-check-refs.sh

  ledger-verify-branch-shape:
    # 只在夜巡分支上跑：确保它只翻状态，不碰别的。
    if: ${{ startsWith(github.head_ref, 'claude/ledger-verify-') }}
    name: Ledger verify branch shape
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check verify branch shape
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/ledger-check-verify-branch.sh
