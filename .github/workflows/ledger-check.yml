name: Ledger check

# 台账检查（2026-09-24 审计）。
#
# 为什么要有这个：
#   审计发现仓库里记了 128 条教训，其中 73% 只存在于文字里 —— 没有任何程序读过它们，
#   所以「记了」和「没记」在机器看来完全一样，漏记永远不会被发现。
#   docs/ledger 是每个窗口都必须写台账的地方；这个检查把「记了」变成可机器验证的事实。
#
# 只读：不用任何仓库 secret，不评论不推送不部署。

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ledger-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ledger-entries-valid:
    # claude/* 自动修复通道与 dependabot 豁免，避免机器提交被台账闸卡住。
    if: ${{ !startsWith(github.head_ref, 'claude/') && !startsWith(github.head_ref, 'dependabot/') }}
    name: Ledger entries valid
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate ledger entries
        run: npx vitest run src/lib/ledger

  code-change-has-ledger-entry:
    # claude/* 自动修复通道与 dependabot 豁免，避免机器提交被台账闸卡住。
    if: ${{ !startsWith(github.head_ref, 'claude/') && !startsWith(github.head_ref, 'dependabot/') }}
    name: Code change has ledger entry
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require a ledger entry for code changes
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          # 三点比对 = 只看这个 PR 自己改了什么；两点比对会把主干这段时间的改动也算进来，主干一动就误拦
          changed=$(git diff --name-only "$base...$head")
          code=$(grep -E '^(src/|supabase/migrations/|render\.yaml$)' <<<"$changed" || true)
          ledger=$(grep -E '^docs/ledger/[^/]+\.md$' <<<"$changed" | grep -v 'README\.md' || true)

          if [[ -n "${code}" && -z "${ledger}" ]]; then
            echo '::error::这个 PR 改了代码（src/、supabase/migrations/ 或 render.yaml）但没写台账。请在 docs/ledger/ 新增或更新一条（格式见 docs/ledger/README.md）。'
            echo 'Changed code files:'
            echo "${code}"
            exit 1
          fi

          {
            echo '## Ledger check'
            echo
            if [[ -n "${code}" ]]; then
              echo '- Code changed: yes'
            else
              echo '- Code changed: no'
            fi
            if [[ -n "${ledger}" ]]; then
              echo '- Ledger files touched:'
              echo "${ledger}" | sed 's/^/  - /'
            else
              echo '- Ledger files touched: none'
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
