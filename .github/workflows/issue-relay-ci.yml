name: Issue Relay CI

on:
  pull_request:
    paths:
      - 'tools/issue-relay/**'
      - '.github/workflows/issue-relay-*.yml'

permissions:
  contents: read

concurrency:
  group: issue-relay-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  issue-relay-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check relay
        run: npx tsc -p tools/issue-relay/tsconfig.json

      - name: Run relay tests
        run: npx vitest run tools/issue-relay --reporter=verbose

      - name: Build relay
        run: npx tsc -p tools/issue-relay/tsconfig.build.json

      - name: Check diff whitespace
        run: git diff --check origin/main...HEAD
