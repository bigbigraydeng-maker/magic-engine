name: Deploy Park Homes site to Cloudflare Pages

# Park Homes（parkhomes.nz）站点在这个仓库里（docs/clients/parkhomes/web），
# 但那边的 Cloudflare Pages 项目（parkhomes-site）从没接过任何 git 集成——
# 一直是靠人手动 build + wrangler deploy 推上线的。2026-09-08 一次会话按
# 正常流程 merge 了一个修复，线上完全没反应，才发现这条自动化从没存在过。
# 见 PR #1496 讨论。
#
# 配置：
#   - GitHub repo Secrets: PARKHOMES_PAGES_DEPLOY_TOKEN（Cloudflare API Token，
#     权限仅 Account > Cloudflare Pages > Edit，仅作用于 Bigbigraydeng@gmail.com
#     的账号 —— parkhomes-site 项目所在的账号）、PARKHOMES_CF_ACCOUNT_ID
on:
  push:
    branches: [main]
    paths:
      - 'docs/clients/parkhomes/web/**'
      - '.github/workflows/parkhomes-deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: docs/clients/parkhomes/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs/clients/parkhomes/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PARKHOMES_PAGES_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.PARKHOMES_CF_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name=parkhomes-site --branch=main --commit-dirty=true
