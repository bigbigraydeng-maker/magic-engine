name: Kernel architecture check

# 内核架构检查（2026-09-27，子牙拍板）。
#
# 为什么要有这个：
#   src/lib/kernel/__tests__/architecture.test.ts 是「对外写必须经过执行内核」这一类边界的执行者，
#   但以前没有任何 workflow 跑它。2026-09-20 ~ 09-24 进主干的改动让它红了两条
#   （3 个文件绕过内核直接调对外写模块、3 组 migration 撞了版本号），
#   直到 09-26 孔子窗口顺手跑才发现。写在测试里的边界，没有程序去跑，就跟写在文档里一样。
#
# 🔴 这个文件是主干规则集的一部分，别顺手「优化」：
#   · 检查名 `Kernel architecture test`（下面的 job name）登记在 Protect main 的必过清单里。
#     改名 = 规则集去等一个永远不会出现的检查，所有 PR 卡在 Expected。
#   · 不许加 paths / branches 过滤：带过滤的必过检查，被过滤掉的 PR 永远等不到结果
#     （同 ops-review-loop-ci.yml 的理由）。
#   · 不许加 continue-on-error、`|| true` 之类让它「红了也算过」的写法。
#
# 只读：不用任何仓库 secret，不评论不推送不部署。

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: kernel-architecture-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  kernel-architecture-test:
    name: Kernel architecture test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 故意用默认的 merge ref（主干 + 本 PR），不像 ledger-check 那样钉 head.sha：
      # 这是全仓不变量测试，要测合进去以后的样子；只测 PR 头会放过「分叉之后主干才进来的文件」
      # （migration 撞号就是这么来的）。
      # 局限：merge ref 只在推送时按当时的主干算一次，主干后来变了不会自己重跑（Protect main
      # 不要求分支先跟上主干）。所以 A 级手动合并前先 update-branch，等这道检查重新变绿再合。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      # 用 A 级路径里的专用配置跑，不走根目录的 vitest.config.ts / vitest.setup.ts：那两个是 B 级文件，
      # 改它们就能把这个测试排除掉、换成路径相似的诱饵文件、或在 setup 里把断言改成空操作。
      - name: Run kernel architecture test
        env:
          RESULTS: ${{ runner.temp }}/kernel-architecture-results.json
        run: >-
          npx vitest run --config src/lib/kernel/__tests__/vitest.architecture.config.ts
          --reporter=verbose --reporter=json --outputFile.json="$RESULTS"
      # 光看退出码还不够，再核一遍：只跑了那一个真文件、零失败、零跳过、通过数不低于下限。
      # 下限写成 !(passed >= min)：结果里字段缺了，同样判红，不会因为「比较不成立」被放过。
      - name: Confirm the tests really ran
        env:
          RESULTS: ${{ runner.temp }}/kernel-architecture-results.json
          # 合并时的条数（2026-09-27：181）。架构测试只该越加越多；真要删测试，改这里同样要过 A 级审。
          MIN_PASSED: '181'
        run: |
          node -e '
            const path = require("path")
            const r = require(process.env.RESULTS)
            const min = Number(process.env.MIN_PASSED)
            const expected = path.join(process.env.GITHUB_WORKSPACE || process.cwd(), "src/lib/kernel/__tests__/architecture.test.ts")
            const files = (r.testResults || []).map((t) => t.name)
            const skipped = r.numPendingTests + r.numTodoTests
            console.log(`files=${JSON.stringify(files)} passed=${r.numPassedTests} failed=${r.numFailedTests} skipped=${skipped} floor=${min}`)
            const problems = []
            if (files.length !== 1 || files[0] !== expected) problems.push(`跑的不是那一个真文件（应当只有 ${expected}）`)
            if (r.numFailedTests !== 0) problems.push(`有 ${r.numFailedTests} 条失败`)
            if (skipped !== 0) problems.push(`有 ${skipped} 条被跳过（skip / todo / 名字过滤）`)
            if (!(r.numPassedTests >= min)) problems.push(`只跑通了 ${r.numPassedTests} 条（下限 ${min}）`)
            for (const p of problems) console.log(`::error::架构测试没有完整跑过：${p}`)
            if (problems.length > 0) process.exit(1)
          '
